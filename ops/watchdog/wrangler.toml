name = "saisoku-watchdog"
main = "src/index.js"
compatibility_date = "2026-10-01"
# 外から呼べる URL は作らない（Cron だけで動かす）
workers_dev = false

# 2分ごと（偶数分）: 速報レーン（主要企業の公式ニュースルームの新着確認）
#   そのうち UTC の分が10の倍数の回だけ: 記事作りの見張り（GitHub の時刻指定が飛ばされても止まらないように）
#   UTC 21:00（日本時間 6:00）: 深夜に作った速報の SNS 投稿（breaking_post.yml）を起動
# 4分ごと（奇数分）: 大きなニュースのレーダー（まとめサイト → 一次情報 → 速報レーン）。別の呼び出しにして取得数の上限を分ける
#   src/index.js の RADAR_CRON と同じ文字列にする
# 10分ごと（3,13,…分）: 朝まとめ・火金問いかけの未完了分を確認（独立した呼び出し）
[triggers]
crons = ["*/2 * * * *", "1-59/4 * * * *", "3-59/10 * * * *"]

# 速報レーンの記録（キー "state": 見た記事の ID・起動した記事の状態・1日の起動数。書くのは速報レーンだけ）
# とレーダーの記録（キー "radar": 扱った見出し・速報レーンへの受け渡し（outbox）。書くのはレーダーだけ）
[[kv_namespaces]]
binding = "FAST"
id = "bf4c8f310b8c4f1eaa794d3b017bb6e4"

# ログを Cloudflare のダッシュボード（Workers Logs）に残す。npx wrangler tail でも見られる
[observability]
enabled = true

[vars]
REPO = "koyuiw7-pixel/ai-news-auto"
WORKFLOW = "auto_run.yml"
# この時間（分）以上、記事作りが始まっていなければ起動する
START_GAP_MIN = "18"
# この時間（分）以上、成功した記事作りが無ければ知らせる
ALERT_GAP_MIN = "120"
# 速報レーン＋レーダー: 1日（日本時間）に新しく起動する安全上限（暴走よけ。通常の記事の上限とは別。超えたら Issue で知らせる）
# scripts/fast_lane_rules.json の daily_max より優先
FAST_DAILY_MAX = "30"
# レーダーだけの1日の安全上限（誤検知の暴走よけ。超えたら Issue で知らせる）
RADAR_DAILY_MAX = "20"
# レーダー: "1" なら outbox に置かずログだけ（動作確認用）
RADAR_DRY_RUN = "0"
# 速報レーン: "1" なら起動せずログだけ（動作確認用）
FAST_DRY_RUN = "0"
# 日付・媒体ごとの履歴と実行中ジョブを照合して定時SNSの取りこぼしを回収。
# 無効化はこの値だけを0へ。速報/災害/レーダーの動作は変えない。
SNS_EXTRA_ENABLED = "1"
SNS_EXTRA_DRY_RUN = "0"

# Buffer監視だけを読み取り確認し、35分以上未起動なら読み取り専用workflowを起動。
BUFFER_MONITOR_WATCHDOG_ENABLED = "1"
BUFFER_MONITOR_WATCHDOG_DRY_RUN = "0"

# 一度限りの復旧経路検証。時刻を過ぎると通常間隔に自動復帰。
BUFFER_MONITOR_PROBE_UNTIL = "2026-10-31T03:27:00Z"
