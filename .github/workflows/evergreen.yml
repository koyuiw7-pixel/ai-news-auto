name: Evergreen guides

# 使い方ガイド（/guides/<slug>、scripts/evergreen.py）。ニュースとは別のレーンで、ニュースの1日上限に数えない。
# 2026-11-06 オーナー決定（台帳 A47）: 検索される話題（使い方・料金・無料でどこまで・比較）を増やす。
# 2時間ごと（1日12回）に未作成のガイドを2本まで作り（1日の上限は既定16本。下げるときだけ変数 EVERGREEN_DAILY_CAP_BRAKE）、
# 14日たった・料金などの関連ニュースが出たガイドを公式ページで確認し直す。
# 変わったときだけデプロイし、ページが公開されたのを確かめてから IndexNow に通知する。
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "作る slug（カンマ区切り。空なら予定表の上から）"
        required: false
        default: ""
      max:
        description: "この回で新しく作る本数"
        required: false
        default: "2"
      force:
        description: "作成済みでも作り直す（only と併用）"
        required: false
        default: "false"
      watch_only:
        description: "Dify公式の変更確認だけを実行（記事生成・公開なし）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: evergreen
  cancel-in-progress: false

jobs:
  guides:
    if: ${{ inputs.watch_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verify editorial protection without external requests
        run: python -m unittest discover -s tests -p test_evergreen_editorial.py

      # 原稿は Claude（オーナーの契約）で書き、事実確認は別のモデル（scripts/quality.py の CHECK_TIER）で行う
      - name: Install Claude Code CLI
        continue-on-error: true
        run: npm i -g @anthropic-ai/claude-code

      - name: Write and re-check guides
        continue-on-error: true
        env:
          LLM_WORKFLOW: evergreen  # 無料枠の取り分を数えるジョブ名（scripts/llm.py）
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_DAILY_MAX: ${{ vars.CLAUDE_DAILY_MAX || '40' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          # 古い変数 EVERGREEN_DAILY_CAP（8）は読まない（台帳 A47 で 16 に上げた）。2026-11-08 台帳 A58: ニュースの記事が0本の回の空いた枠
          # （夜・週末）をガイドで埋めるので 20 に（ニュースの段 60 本＋ガイドで1日60本の段を確実に満たす）
          EVERGREEN_DAILY_CAP: ${{ vars.EVERGREEN_DAILY_CAP_BRAKE || '20' }}
          # Claude API の Haiku（中心の段。予算が苦しくても無料モデルに下げない）→ 無料モデル。使用量はこのジョブ専用のファイルに記録（scripts/llm.py）
          # 2026-11-06（台帳 A47）: 「その他」の段では予算の配分で無料モデルになり、無料枠切れで1本も作れない日が続いたので「中心」にする
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_API_MONTHLY_BUDGET_USD }}
          LLM_DEFAULT_PURPOSE: core
          CLAUDE_API_LEDGER: evergreen
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$ONLY" ]; then
            timeout 2700 python scripts/evergreen.py --only "$ONLY" $([ "$FORCE" = "true" ] && echo --force) --budget 2400
          else
            timeout 2700 python scripts/evergreen.py --max "${{ inputs.max || '2' }}" --refresh --refresh-max 2 --budget 2100
          fi

      - name: Commit & push
        id: commit
        run: |
          # LLM の使用回数（content/llm_usage.json）は記事の回が記録するので、ここでは捨てる（push の衝突を避ける）
          git checkout -- content/llm_usage.json 2>/dev/null || true
          git add content/howto 2>/dev/null || true
          git add state/evergreen_failed.json 2>/dev/null || true
          git add state/claude_api_usage_evergreen.json 2>/dev/null || true
          git add state/llm_usage_evergreen.json 2>/dev/null || true
          CHANGED=$(git diff --cached --name-only -- content/howto | sed -n 's#content/howto/\(.*\)\.json#\1#p' | tr '\n' ',')
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$CHANGED" ]; then MSG="chore(guides): 使い方ガイドを作成・確認 (${CHANGED%,})"; else MSG="chore(llm): Claude API の使用量を記録（ガイド）"; fi
          git commit -m "$MSG"
          python3 scripts/git_safe_push.py && exit 0
          echo "::error::push に失敗しました"
          exit 1

      - name: Deploy to Cloudflare
        if: ${{ steps.commit.outputs.changed != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_cloudflare.yml --ref main

      # 公開されたのを確かめてから IndexNow に通知する（公開前の URL を送らない）
      - name: Notify IndexNow
        if: ${{ steps.commit.outputs.changed != '' }}
        continue-on-error: true
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          BASE=https://ai-tech-express.jp
          URLS="$BASE/guides"
          for slug in $(echo "$CHANGED" | tr ',' ' '); do URLS="$URLS,$BASE/guides/$slug"; done
          FIRST=$(echo "$CHANGED" | cut -d, -f1)
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /tmp/page.html -w '%{http_code}' "$BASE/guides/$FIRST?v=$(date +%s)")
            if [ "$CODE" = "200" ] && grep -q "$(jq -r '.checkedAt[0:10]' "content/howto/$FIRST.json" | tr '-' '/')" /tmp/page.html; then
              echo "公開を確認（${i}回目）"
              python scripts/indexnow.py --urls "$URLS"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::20分待っても公開を確認できなかったので IndexNow は次の記事の回に任せる"

  dify-search-watch:
    # 独立ジョブ。失敗しても既存のガイド生成や速報の処理を待たせない。
    # 確認待ち資料を作るだけで、記事・SNS・メールは公開しない。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify source watch and reviewed-answer boundary
        run: |
          python -m unittest discover -s tests -p test_dify_search_watch.py
          python -m unittest discover -s tests -p test_dify_answer_update.py
      - name: Identify monitored source set
        id: source-key
        run: python -c 'from scripts.dify_search_watch import SOURCE_FINGERPRINT; print("fingerprint=" + SOURCE_FINGERPRINT)' >> "$GITHUB_OUTPUT"
      - name: Restore last successful source snapshots
        uses: actions/cache/restore@v4
        with:
          path: .cache/dify-search-watch/state.json
          key: dify-search-watch-v1-${{ steps.source-key.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dify-search-watch-v1-${{ steps.source-key.outputs.fingerprint }}-
      - name: Check official sources without publishing
        id: scan
        continue-on-error: true
        run: python scripts/dify_search_watch.py --state .cache/dify-search-watch/state.json --report work/dify-search-watch/report.json
      - name: Prepare answer review packets without editing guides
        if: ${{ always() && hashFiles('.cache/dify-search-watch/state.json') != '' }}
        run: |
          python scripts/dify_answer_update.py --state .cache/dify-search-watch/state.json --packet work/dify-search-watch/answer-review-packets.json
          cp .cache/dify-search-watch/state.json work/dify-search-watch/source-state.json
      - name: Preserve good baselines and review queue
        if: ${{ always() && hashFiles('.cache/dify-search-watch/state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/dify-search-watch/state.json
          key: dify-search-watch-v1-${{ steps.source-key.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save editorial review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dify-search-review
          path: |
            work/dify-search-watch/report.json
            work/dify-search-watch/answer-review-packets.json
            work/dify-search-watch/source-state.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report source retrieval failure
        if: ${{ steps.scan.outcome == 'failure' }}
        run: |
          echo "::error::Dify公式の取得に失敗。前回の成功基準を保持しました。ガイド生成ジョブとは独立しています。"
          exit 1
