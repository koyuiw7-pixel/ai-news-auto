name: SNS rules check

# SNS 投稿のルールの門番（scripts/sns_rules.py）のテスト。
# 投稿 API（Buffer の createPost・editPost、Bluesky の createRecord、Threads 公式 API、Instagram の media_publish）を呼ぶ所がすべて
# sns_rules.enforce を通っているかを検査する（新しい経路が門番を飛ばしていたら失敗する）。何も投稿しない。
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "lib/**"
      - "app/**"
      - "cloudflare/**"
      - "ops/**"
      - ".github/workflows/sns_rules.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Gate and call-site check (nothing is posted)
        env:
          SNS_RULES_NO_ISSUE: "1"
        run: python -m unittest tests.test_sns_rules tests.test_morning_digest tests.test_sns_post_text tests.test_bluesky_post tests.test_bluesky_slots_20261106 tests.test_x_slots_20261106 tests.test_facebook_slots_20261106 tests.test_sns_video_followup tests.test_sns_video_required tests.test_sns_growth_20261105 tests.test_instagram_post tests.test_sns_dup_footer_20261105 tests.test_threads_recovery_20261106 tests.test_sns_official_photo_20261107 tests.test_threads_reader_20261108 tests.test_x_format_20261109 tests.test_bluesky_images_20261109 tests.test_x_link_ab_20261110 tests.test_x_life_money_20261110 tests.test_sns_hours_20261110 -v
