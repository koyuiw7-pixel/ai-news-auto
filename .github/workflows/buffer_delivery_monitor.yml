name: Buffer delivery monitor (read only)
on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
  # GitHub scheduleの遅延・欠落に備え、既存の記事処理が完了した後も確認する。
  # SNS投稿を行うworkflowは変更・起動しない。
  workflow_run:
    workflows: ['Auto Article Pipeline']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: buffer-delivery-monitor
  cancel-in-progress: false
jobs:
  monitor:
    # workflow_runでは同一repo/mainの通常処理だけ。外部PRや速報レーンは除外。
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main' &&
           contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event) &&
           startsWith(github.event.workflow_run.display_title, 'Auto Article Pipeline (')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read Buffer delivery and check upcoming images
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/buffer_delivery_monitor.py
