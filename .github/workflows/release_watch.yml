name: Release watch
# 発表時刻が決まった速報（統計・決算）の見張り（2026-11-05 オーナー承認・台帳 W35）。
# 予定表 scripts/release_calendar.json の発表時刻の前だけ起動し（その日付だけの cron。予定表から
# `python scripts/release_watch.py sync-workflow` で作る。tests/test_release_watch.py がずれを見つける）、
# 公式の PDF が新しい対象期間で出て、決まった数字の行が読めたときだけ速報レーン（auto_run.yml の fast_url）を起こす。
# 読めないときは速報にしない（失敗として終わる＝赤い×。記事は通常の回に任せる）。SNS には何も投稿しない。
# GitHub の schedule は遅れることがあるので、1つの予定に4回の起動を置く。同時には1つだけ動き、後の回は前の回が
# 起こした速報レーンの実行を見つけてすぐ終わる（同じ URL を二重に起こさない）。
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release watch（手動 {0}{1}）', inputs.event || 'すべて', inputs.dry_run == 'false' && '・本番' || '・試し') || 'Release watch' }}

on:
  schedule:
    # BEGIN release_calendar crons（scripts/release_watch.py sync-workflow が書く。手で直さない）
    - cron: "2 23 5 11 *"
    - cron: "10 23 5 11 *"
    - cron: "17 23 5 11 *"
    - cron: "23 23 5 11 *"
    - cron: "2 23 9 11 *"
    - cron: "10 23 9 11 *"
    - cron: "17 23 9 11 *"
    - cron: "23 23 9 11 *"
    - cron: "25 3 10 11 *"
    - cron: "33 3 10 11 *"
    - cron: "40 3 10 11 *"
    - cron: "46 3 10 11 *"
    - cron: "25 3 11 11 *"
    - cron: "33 3 11 11 *"
    - cron: "40 3 11 11 *"
    - cron: "46 3 11 11 *"
    - cron: "22 23 11 11 *"
    - cron: "30 23 11 11 *"
    - cron: "37 23 11 11 *"
    - cron: "43 23 11 11 *"
    - cron: "55 4 12 11 *"
    - cron: "3 5 12 11 *"
    - cron: "10 5 12 11 *"
    - cron: "16 5 12 11 *"
    - cron: "55 1 13 11 *"
    - cron: "3 2 13 11 *"
    - cron: "10 2 13 11 *"
    - cron: "16 2 13 11 *"
    - cron: "22 23 15 11 *"
    - cron: "30 23 15 11 *"
    - cron: "37 23 15 11 *"
    - cron: "43 23 15 11 *"
    - cron: "22 23 18 11 *"
    - cron: "30 23 18 11 *"
    - cron: "37 23 18 11 *"
    - cron: "43 23 18 11 *"
    - cron: "50 5 19 11 *"
    - cron: "58 5 19 11 *"
    - cron: "5 6 19 11 *"
    - cron: "11 6 19 11 *"
    - cron: "2 23 19 11 *"
    - cron: "10 23 19 11 *"
    - cron: "17 23 19 11 *"
    - cron: "23 23 19 11 *"
    # END release_calendar crons
  workflow_dispatch:
    inputs:
      event:
        description: "この予定だけ（空ならいま見張る予定すべて）"
        required: false
        default: ""
      dry_run:
        description: "true=見つけても速報レーンを起こさない（試し） / false=本番と同じく起こす"
        required: false
        default: "true"
      sample:
        description: "前回の発表で読み取りだけ試す予定の id（何も起こさない。例 maikin-2026-09）"
        required: false
        default: ""

permissions:
  contents: read
  actions: write  # 速報レーン（auto_run.yml）を起こし、その実行の状態を見る

concurrency:
  group: release-watch
  cancel-in-progress: false

env:
  # Threads の記事のリンクの位置（2026-11-06 テストの日・オーナー承認・台帳 S31/S39）。reply＝本文はリンク無し＋返信にリンク、body＝本文の最後。
  # 空なら body（11/5 の決まり）。切り替えは Actions の Variables の THREADS_LINK_POS だけ（予約中の投稿も出る前の読み直しで今の位置に直る）
  THREADS_LINK_POS: ${{ vars.THREADS_LINK_POS || 'body' }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 速さのため、要るものだけ入れる（PDF の文字の取り出し。財務省・内閣府の暗号化された PDF に cryptography）
      - run: pip install "pypdf>=5.0,<7" "cryptography>=42"
      # 決算短信の1ページ目の表の数字は pypdf だと落ちる。poppler の pdftotext -layout を先に使う（scripts/pdf_text.py・台帳 W35）
      - name: Install poppler
        continue-on-error: true  # 入らなくても pypdf で読む（scripts/pdf_text.py）
        run: (command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)) >/dev/null && pdftotext -v 2>&1 | head -1
      - name: Watch
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ inputs.event }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false' && '1' || '' }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          if [ -n "$SAMPLE" ]; then
            python scripts/release_watch.py sample --event "$SAMPLE"
            exit $?
          fi
          python scripts/release_watch.py run ${EVENT:+--event "$EVENT"} ${DRY_RUN:+--dry-run}
