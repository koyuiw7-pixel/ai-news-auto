name: Owner rules tests

# オーナーのルールの台帳（docs/owner_rules.md）を守らせるテスト。台帳に書いたテストのうち、
# ほかのワークフロー（deploy_cloudflare.yml・sns_rules.yml など）で動いていないものをここでまとめて動かす。
# tests/test_owner_rules_ledger.py が「台帳に書いたテストがどこかで動いているか」を確かめる。何も投稿しない。
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "lib/**"
      - "app/**"
      - "components/**"
      - "cloudflare/**"
      - "docs/owner_rules.md"
      - "AGENTS.md"
      - "site.config.ts"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Owner rule tests (nothing is posted)
        env:
          SNS_RULES_NO_ISSUE: "1"
        run: |
          python -m unittest -v \
            tests.test_owner_rules_ledger tests.test_owner_rules_audit tests.test_owner_rules_gaps \
            tests.test_search_title_20261110 tests.test_zero_visit_noindex_20261110 tests.test_partner_feed_description_20261110 \
            tests.test_sns_owner_rules_20261103 tests.test_retired_sources tests.test_images_official \
            tests.test_rivals tests.test_verdict_scope tests.test_persona tests.test_article_quickwins \
            tests.test_buffer_budget tests.test_quality_language tests.test_sns_hook_context tests.test_article_quality_short \
            tests.test_git_safe_push tests.test_pipeline_health tests.test_pacing tests.test_review_period \
            tests.test_news_types tests.test_article_style tests.test_pricing_scope tests.test_products_gate tests.test_genre_focus tests.test_index_rules tests.test_digest_titles tests.test_digest_page tests.test_notice_gate tests.test_labels \
            tests.test_claude_api_routing tests.test_workers_ai_budget_20261107 tests.test_cost_audit_20261107 tests.test_question_patterns tests.test_research_firms tests.test_radar_primary_sources tests.test_rule_consistency tests.test_public_interest tests.test_news_mix tests.test_pivot_20261104 tests.test_owner_decisions_20261104b tests.test_owner_decisions_20261105 tests.test_owner_decisions_20261105_evening tests.test_testday_20261106 tests.test_reader_order_20261105 tests.test_sns_template_fixes_20261105 tests.test_sns_dup_footer_20261105 tests.test_release_watch tests.test_search_protected tests.test_owner_decision_20261106_scale tests.test_never_stop_20261106 tests.test_rescue_caps_20261107 tests.test_volume_stage_20261108 tests.test_never_stop_20261109 tests.test_sns_volume_20261108 tests.test_muse_articles_20261108 tests.test_muse_images_20261108 tests.test_japanese_enterprise_20261107 tests.test_click_titles_20261107 tests.test_noir_layout tests.test_noir_cover tests.test_wider_sources_20261107 tests.test_topic_lists_20261107 tests.test_people_restore_20261107 tests.test_rank_intent_20261107 tests.test_evergreen_pool_20261107 tests.test_wide_topics_20261107 tests.test_life_mix_20261107 tests.test_ai_label_20261107 tests.test_share_image_cover_20261107 tests.test_images_release tests.test_search_trends_20261108 tests.test_research_20261108 tests.test_gpt_review_20261108 tests.test_depth_fields_20261109 tests.test_seo_rules_20261109 tests.test_volume_sources_20261110 tests.test_deep_dive_20261110 tests.test_guide_not_duplicate_20261110 tests.test_image_coverage_20261110 tests.test_stale_cutoff_20261113 tests.test_winning_notices_20261113
