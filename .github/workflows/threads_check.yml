name: Threads connection check

# 手動実行専用。Buffer（または公式API）の接続先と下書きを確認するだけで、何も投稿しない
on:
  workflow_dispatch:

permissions:
  contents: write  # Buffer の呼び出し回数の記録（state/buffer_calls）を残す

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # 最新の投稿の記録を読む（S20）
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Buffer connection
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LEDGER: check
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
        run: python scripts/threads_post.py --check-buffer
      - name: Test new post format (creates and deletes a Buffer draft, nothing is published)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LEDGER: check
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
        run: python scripts/threads_post.py --test-draft
      - name: Learn from post metrics (read only, nothing is published)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LEDGER: check
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
          AFF_STATS_TOKEN: ${{ secrets.AFF_STATS_TOKEN }}
        run: python scripts/threads_learn.py && cat state/threads_learning.json | head -60
      - name: Draft posts (not published)
        run: python scripts/threads_post.py --dry-run --hours 72 --max 2
      # Buffer の呼び出し回数を main に残す（30日の合計を全部のワークフローで数える。scripts/buffer_budget.py・2026-11-05）
      - name: Save Buffer call ledger
        if: ${{ always() }}
        continue-on-error: true
        run: |
          f=state/buffer_calls/check.json
          if [ ! -f "$f" ] || [ -z "$(git status --porcelain "$f")" ]; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "chore(buffer): Buffer の呼び出し回数を記録 [no-deploy]"
          python3 scripts/git_safe_push.py
