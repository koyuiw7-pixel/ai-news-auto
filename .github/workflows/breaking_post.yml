name: Breaking post

# 速報の即時投稿。auto_run.yml が速報記事（breaking: true）を作ってデプロイした回に呼ぶ。
# 記事ページと図解カード（/card/<slug>）が 200 になるのを最大8分待ち、Buffer で Threads・X・Facebook にすぐ出す。
# 上限・対象の条件は scripts/breaking_post.py を参照（1日 BREAKING_PER_DAY 本まで・深夜は出さず朝 6:00 に出す）。
# 見張り番の Worker（ops/watchdog）が毎朝 6:00（日本時間）にも起動する（深夜に作った速報を出すため）。
# 自分の投稿だけを扱う。他人の投稿へのコメント・返信は自動化しない。
# 同時に push ジョブが、読者のブラウザへの速報のプッシュ通知を頼む（scripts/push_notify.py → サイトの /api/push/send）。
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # SNS ルールの門番（scripts/sns_rules.py）が止めた投稿の issue（ラベル sns-rule-violation）

concurrency:
  group: breaking-post
  cancel-in-progress: false

env:
  # Threads の記事のリンクの位置（2026-11-06 テストの日・オーナー承認・台帳 S31/S39）。reply＝本文はリンク無し＋返信にリンク、body＝本文の最後。
  # 空なら body（11/5 の決まり）。切り替えは Actions の Variables の THREADS_LINK_POS だけ（予約中の投稿も出る前の読み直しで今の位置に直る）
  THREADS_LINK_POS: ${{ vars.THREADS_LINK_POS || 'body' }}

jobs:
  # 速報のプッシュ通知（記事ページが開けるようになったらすぐ。1日3回まで・夜は朝7時に回すなどの判定は Worker がする）
  # 失敗しても SNS の投稿は止めない（別のジョブ）
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # きっかけの時点の古い commit ではなく、最新の記録を読む（二重投稿よけ）
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Push notification
        env:
          PUSH_SEND_TOKEN: ${{ secrets.PUSH_SEND_TOKEN }}
        run: python scripts/push_notify.py --wait 480

  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # きっかけの時点の古い commit ではなく、最新の記録を読む（二重投稿よけ）
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 動画（shorts_v3）を作れる記事かを確かめるため（2026-11-05 夕方からは動画が無くても写真・カードで出す。sns_rules ルール8）
      - name: 準備（動画の判定に使う numpy・Pillow）
        run: pip install -q numpy pillow
      - name: Post breaking news
        env:
          THREADS_MODE: ${{ vars.THREADS_MODE }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LEDGER: breaking
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
          SNS_HOOK_FORMAT: ${{ vars.SNS_HOOK_FORMAT || '1' }}  # Muse の型の文面（2026-11-05 オーナー承認で既定 1。止めるなら変数を 0。台帳 S30）
          BREAKING_PER_DAY: ${{ vars.BREAKING_PER_DAY }}
          GH_TOKEN: ${{ github.token }}  # 門番が止めた投稿の issue を立てる
        run: python scripts/breaking_post.py --wait 480
      # Bluesky にはミサイル・災害の知らせだけすぐ出す（AT Protocol を直接。失敗しても止めない）。
      # ほかの速報は bluesky.yml の Bluesky だけの枠（13:00 など。台帳 S40）で出す
      - name: Post to Bluesky
        continue-on-error: true
        env:
          THREADS_MODE: ${{ vars.THREADS_MODE }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SNS_HOOK_FORMAT: ${{ vars.SNS_HOOK_FORMAT || '1' }}  # Muse の型の文面（2026-11-05 オーナー承認で既定 1。止めるなら変数を 0。台帳 S30）
          GH_TOKEN: ${{ github.token }}  # 門番が止めた投稿の issue を立てる
        run: python scripts/bluesky_post.py --alerts-only
      # 待っている間に main が進んでいても衝突しないよう、最新の state に投稿記録だけを足して push する
      - name: Commit history
        run: |
          if [ -z "$(git status --porcelain state)" ]; then exit 0; fi
          cp state/threads_posted.json "$RUNNER_TEMP/mine.json"
          cp state/buffer_calls/breaking.json "$RUNNER_TEMP/buffer_ledger.json" 2>/dev/null || true  # Buffer の呼び出し回数（30日の合計に要る。2026-11-05）
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python scripts/breaking_post.py --merge "$RUNNER_TEMP/mine.json"
            python scripts/bluesky_post.py --merge "$RUNNER_TEMP/mine.json"
            git add state/threads_posted.json
            if [ -f "$RUNNER_TEMP/buffer_ledger.json" ]; then mkdir -p state/buffer_calls; cp "$RUNNER_TEMP/buffer_ledger.json" state/buffer_calls/breaking.json; git add state/buffer_calls/breaking.json; fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(threads): 速報の投稿を記録"
            git push origin HEAD:main && exit 0
            echo "push に失敗しました。リトライ $i/5"
            sleep 5
          done
          echo "::warning::速報の投稿記録を push できませんでした（通常の予約で二重投稿する恐れがあります）"
          exit 1
