name: SNS video follow-up (flagged, default off)

# SNS（Threads・X・Facebook）に出す記事の解説動画（v3）を作り、動画つきで Buffer に予約する（1記事1投稿。2026-11-03 オーナー決定）。
# 2026-11-05 夕方 オーナー決定「動画を待たない」「動画を作る記事を限定」（sns_rules ルール8・台帳 S13）: threads_post / breaking_post は
# 「予定」として記録するだけで、ここ（sns_video_followup.publish_queued）が枠の順に送る。ふつうの投稿は記事の写真・カードで枠の時刻に、
# 動画を作る限られた記事（sns_plan.video_post・1日4本まで）だけ枠から1時間まで動画を待つ（無ければ写真・カード）。記事ページにもサイト用を載せる。
# 2026-11-03 オーナー決定「SNS に投稿した記事は全部」「同じ台本からサイト用（全部）と SNS 用（短い版）」「1週間、投稿ごとに短い版と全部の版を交互（A/B）」。
# **既定では何もしない。** Actions の Variables で順に有効にする（docs/sns-video-v3-20261102.md「自動化の計画」）:
#   SNS_VIDEO_FOLLOWUP=on  … 定期実行で動画を作る（ゲートまで。投稿しない）
#   SNS_VIDEO_UPLOAD=on    … 合格した動画を Workers KV（saisoku-images）に置き、https://ai-tech-express.jp/video/<名前>.mp4 で配信（新しい鍵は不要。
#                            配信は cloudflare/worker.ts の /video/。サイトのデプロイ後に有効）
#   SNS_VIDEO_EMBED=on     … 記事 JSON に video を書く（次のデプロイで記事ページに動画が出る）
#   SNS_VIDEO_POST=live    … Buffer の予約中の Threads の投稿の写真を動画に差し替える（予約の時刻は変えない）
#   SNS_VIDEO_BREAKING_FOLLOWUP=on … 速報の記事だけ、あとから動画の投稿を別に出す（既定 off・オーナーの判断待ち）
#   SNS_VIDEO_TEMPLATES=off … 記事の中身に合わせた動画の型（scripts/video_templates.py）を使わない（既定 on・2026-11-04 オーナー承認）
#   SNS_VIDEO_AB_UNTIL=YYYY-MM-DD … この日まで投稿ごとに short / full を交互（記事のリンクに utm_content=short|full）
# 手動実行（workflow_dispatch）は投稿しない（作る・置く・記事に載せるは Variables に従う）。
on:
  schedule:
    - cron: "45 * * * *"  # 毎時45分（文面の投稿 15/35/55 分のあと）。SNS_VIDEO_FOLLOWUP=on のときだけ動く
  # GitHub の定期実行は混むと何時間も動かないことがあるので、記事の自動処理（文面の投稿もここ）が終わるたびにも動く
  workflow_run:
    workflows: ["Auto Article Pipeline", "Breaking post"]  # 速報も動画ができしだい出す
    types: [completed]
  workflow_dispatch:
    inputs:
      plan_only:
        description: "対象を表示するだけ（true）／動画を作ってゲートまで（false）"
        default: "true"
      draft_test_url:
        description: "（テスト）この動画 URL で Buffer に Threads の下書きを1本だけ作る（公開しない）。空なら何もしない"
        default: ""
      check_post:
        description: "（確認）この Buffer の投稿 ID の状態を読むだけ。空なら何もしない"
        default: ""
      merge_draft_slug:
        description: "（テスト）この記事の写真の下書きを1本作り、動画に差し替えて読み直す（下書きなので公開しない）。空なら何もしない"
        default: ""
      queue_fix:
        description: "（直す）Buffer の予約中の投稿: plan＝一覧だけ／apply＝下書きに戻して動画つきで出し直す／presend-plan・presend-apply＝今の SNS ルールで読み直して文面をその場で直す（48時間先まで。S38）。空なら何もしない"
        default: ""
      repost:
        description: "（出し直し）slug[,slug]（承認済みの文面は content/sns_reposts）・動画つきで次のふつうの枠に。枠を決めるなら slug@2026-11-04T09:45+09:00。空なら何もしない"
        default: ""
      adopt_video:
        description: "（出し直し）検査に合格した保存済みの動画を使う: slug:実行ID（その実行の成果物から <slug>__v3*.mp4 と report を探す）。空なら作り直す"
        default: ""
      swap_video:
        description: "（オーナーが選んだ動画に替える）slug:ブランチ:ファイル（そのブランチにある mp4 を置いて予約中の投稿の動画を替える）。空なら何もしない"
        default: ""
      requeue:
        description: "（直す）下書きに戻した X・Facebook の投稿を動画つきで出し直す（例 slug:facebook）。空なら何もしない"
        default: ""
      today_report:
        description: "（確認）今日の Threads の投稿ごとに、動画が付いたか・理由を読むだけ（true）"
        default: "false"

permissions:
  actions: read  # 出し直しで、検査に合格した保存済みの動画（ほかの実行の成果物）を読む
  contents: write  # state/sns_video.json と Claude API の使用量を main に残すため
  issues: write  # SNS ルールの門番（scripts/sns_rules.py）が止めた差し替えの issue

concurrency:
  group: sns-video-followup
  cancel-in-progress: false  # 実行中に来た分は1つだけ待ち、それ以上は取り消される（次の回で拾う）

jobs:
  followup:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SNS_VIDEO_FOLLOWUP == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50  # 1回 最大3本 × 2つの版
    steps:
      - name: VOICEVOX を裏で起動
        run: nohup sh -c 'docker run -d --rm --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-latest' > /tmp/voicevox.log 2>&1 &
      - uses: actions/checkout@v7
        with:
          # workflow_run の既定は「きっかけの時点の commit」で、待っている間にほかの回が送った記録が見えない
          # （2026-11-04 Kimi K3 の二重投稿）。いつも最新の main を読む
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: 準備（Python・Claude CLI・日本語フォント）
        run: |
          npm i -g @anthropic-ai/claude-code > /tmp/claude-install.log 2>&1 &
          pip install -r requirements.txt numpy pillow budoux opencv-python-headless playwright imageio-ffmpeg
          mkdir -p ~/.local/share/fonts && cp assets/fonts/NotoSansJP-*.otf ~/.local/share/fonts/ && fc-cache -f > /dev/null
          wait
      - name: 動画を作る（フラグに従う）
        env:
          # 2026-11-03: 動画の台本は無料の LLM（Gemini など）を使わない。鍵を渡さない＝記事づくりの無料枠を食わない（Claude API → CLI だけ。無ければ動画なし）
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: sonnet  # 自動の処理では Opus を使わない（2026-11-04 オーナー決定）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_DEFAULT_VISIBILITY: high
          LLM_DEFAULT_PURPOSE: video
          CLAUDE_API_LEDGER: video
          # Claude CLI（サブスクリプション）の回数は state/llm_usage_video.json に、台本・画像の確認ごとに数える（API の上限のあとも続ける）
          LLM_WORKFLOW: video
          CLAUDE_CLI_DAILY_VIDEO: ${{ vars.CLAUDE_CLI_DAILY_VIDEO || '60' }}  # 2026-11-04 オーナー: サブスクリプションの使いすぎを抑える
          CLAUDE_CLI_DAILY_VIDEO_REVIEW: ${{ vars.CLAUDE_CLI_DAILY_VIDEO_REVIEW || '40' }}
          CLAUDE_API_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_API_MONTHLY_BUDGET_USD }}
          CLAUDE_API_DAILY_CALLS_VIDEO: ${{ vars.CLAUDE_API_DAILY_CALLS_VIDEO }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # Buffer の呼び出しは「動画ができて、差し替える予約がある」ときだけ。回数の記録は state/buffer_calls/video.json
          BUFFER_LEDGER: video
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
          BUFFER_DAILY_CAP: ${{ vars.BUFFER_DAILY_CAP }}
          CF_KV_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}  # images.py の kv_put と同じ（Workers KV Storage:Edit）
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 手動実行は「作るだけ」。投稿・アップロードは定期実行で Variables が on/live のときだけ
          SNS_VIDEO_FOLLOWUP: ${{ github.event_name == 'workflow_dispatch' && 'on' || vars.SNS_VIDEO_FOLLOWUP }}
          # 置く・記事に載せるは手動実行でも Variables に従う。投稿だけは定期実行のときだけ（決まった時刻の流れの中で出す）
          SNS_VIDEO_UPLOAD: ${{ vars.SNS_VIDEO_UPLOAD || 'off' }}
          SNS_VIDEO_POST: ${{ github.event_name != 'workflow_dispatch' && vars.SNS_VIDEO_POST || 'off' }}
          SNS_VIDEO_EMBED: ${{ vars.SNS_VIDEO_EMBED || 'off' }}
          SNS_VIDEO_DAILY_MAX: ${{ vars.SNS_VIDEO_DAILY_MAX || '30' }}  # 記事の投稿はすべて動画が要る（通常枠9＋速報）
          SNS_VIDEO_PER_RUN: ${{ vars.SNS_VIDEO_PER_RUN || '2' }}  # 1本は段（最大12分）まで。50分のうちに入るように
          SNS_VIDEO_AB_UNTIL: ${{ vars.SNS_VIDEO_AB_UNTIL }}
          SNS_VIDEO_AFTER_AB: ${{ vars.SNS_VIDEO_AFTER_AB || 'short' }}
          SNS_VIDEO_STORE: ${{ vars.SNS_VIDEO_STORE || 'kv' }}
          GH_TOKEN: ${{ github.token }}  # 門番が止めた投稿の issue を立てる
          SNS_VIDEO_BREAKING_FOLLOWUP: ${{ vars.SNS_VIDEO_BREAKING_FOLLOWUP || 'off' }}
          # 中身に合わせた動画の型（scripts/video_templates.py）。2026-11-04 オーナー承認で既定 on（off で今までの1つの型）
          SNS_VIDEO_TEMPLATES: ${{ vars.SNS_VIDEO_TEMPLATES || 'on' }}
          SNS_HOOK_FORMAT: ${{ vars.SNS_HOOK_FORMAT || '1' }}  # Muse の型の文面（2026-11-05 オーナー承認で既定 1。止めるなら変数を 0。台帳 S30）
          MUSE_WAIT_HOURS: ${{ vars.MUSE_WAIT_HOURS }}  # Muse の動画を待つ時間（空なら scripts/sns_plan.json の4時間）
        run: |
          qf="${{ github.event.inputs.queue_fix }}"
          if [ "$qf" = "presend-plan" ] || [ "$qf" = "presend-apply" ]; then
            # 予約中の投稿を今の門番で読み直す（presend-apply のときだけ直す。直す編集も門番を通る。消さない。台帳 S38）
            python scripts/sns_video_followup.py --presend "${qf#presend-}" --hours 48
            exit $?
          fi
          if [ -n "${{ github.event.inputs.queue_fix }}" ]; then
            # 予約中の写真の投稿を下書きに戻し、新しい形の文面・動画つきで同じ枠に出し直す（apply のときだけ。投稿は門番を通る）
            SNS_VIDEO_POST=live python scripts/sns_video_followup.py --queue-fix "${{ github.event.inputs.queue_fix }}"
            exit $?
          fi
          if [ -n "${{ github.event.inputs.repost }}${{ github.event.inputs.adopt_video }}" ]; then
            args=()
            rp="${{ github.event.inputs.repost }}"
            if [ -n "$rp" ]; then
              slugs="${rp%%@*}"; args+=(--repost "$slugs")
              [ "$rp" != "$slugs" ] && args+=(--slot "${rp#*@}")
            fi
            av="${{ github.event.inputs.adopt_video }}"
            if [ -n "$av" ]; then
              mkdir -p "$RUNNER_TEMP/adopt"
              gh run download "${av#*:}" -D "$RUNNER_TEMP/adopt"
              args+=(--adopt-video "${av%%:*}" "$RUNNER_TEMP/adopt")
            fi
            SNS_VIDEO_POST=live python scripts/sns_video_followup.py "${args[@]}" --publish
            exit $?
          fi
          if [ -n "${{ github.event.inputs.swap_video }}" ]; then
            sv="${{ github.event.inputs.swap_video }}"; slug="${sv%%:*}"; rest="${sv#*:}"; br="${rest%%:*}"; file="${rest#*:}"
            git fetch -q origin "$br" && git show "origin/$br:$file" > "$RUNNER_TEMP/swap.mp4"
            python scripts/sns_video_followup.py --swap-video "$slug" "$RUNNER_TEMP/swap.mp4" "2026-11-04 オーナーが copilot_A_v3 を選んだ"
            exit $?
          fi
          if [ -n "${{ github.event.inputs.requeue }}" ]; then
            SNS_VIDEO_POST=live python scripts/sns_video_followup.py --requeue "${{ github.event.inputs.requeue }}"
            exit $?
          fi
          if [ "${{ github.event.inputs.today_report }}" = "true" ]; then
            python scripts/sns_video_followup.py --today
            exit $?
          fi
          if [ -n "${{ github.event.inputs.merge_draft_slug }}" ]; then
            # 差し替えのテストだけ（下書き。公開しない）。ほかは何もしない
            python scripts/sns_video_followup.py --merge-draft-test "${{ github.event.inputs.merge_draft_slug }}" --yes
            exit $?
          fi
          if [ -n "${{ github.event.inputs.check_post }}" ]; then
            python scripts/sns_video_followup.py --check-post "${{ github.event.inputs.check_post }}"
            python scripts/sns_video_followup.py --ab-report || true
            exit 0
          fi
          if [ -n "${{ github.event.inputs.draft_test_url }}" ]; then
            # 下書きのテストだけ（saveToDraft。公開しない）。ほかは何もしない
            python scripts/sns_video_followup.py --draft-test content/video_scripts/claude-ultra-plan-price-limits.short.report.json "${{ github.event.inputs.draft_test_url }}" --yes
            exit $?
          fi
          if [ "${{ github.event.inputs.plan_only }}" = "true" ]; then
            python scripts/sns_video_followup.py --plan
          else
            python scripts/sns_video_followup.py
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sns-video-${{ github.run_number }}
          path: |
            out/sns_video_followup/*.mp4
            out/sns_video_followup/*.png
            out/sns_video_followup/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: 記録を main に残す（動画の記録・Claude API の使用量・記事の video）
        if: ${{ always() && (github.event.inputs.plan_only != 'true' || github.event.inputs.queue_fix == 'apply' || github.event.inputs.queue_fix == 'presend-apply' || github.event.inputs.requeue != '' || github.event.inputs.repost != '' || github.event.inputs.adopt_video != '' || github.event.inputs.swap_video != '') }}
        continue-on-error: true
        run: |
          files="state/sns_video.json state/claude_api_usage_video.json state/buffer_calls/video.json state/llm_usage_video.json"
          python scripts/sns_video_followup.py --sync-posted || true
          [ -n "$(git status --porcelain state/threads_posted.json state/bluesky_extra.json)" ] && changed_posted=1 || changed_posted=""
          changed=""; for f in $files; do [ -f "$f" ] && [ -n "$(git status --porcelain "$f")" ] && changed="$changed $f"; done
          embeds=$(git status --porcelain content/articles | awk '{print $2}')
          [ -z "$changed$embeds$changed_posted" ] && exit 0
          for f in $changed; do cp "$f" "$RUNNER_TEMP/$(basename "$f")"; done
          mkdir -p "$RUNNER_TEMP/embeds"; for f in $embeds; do cp "$f" "$RUNNER_TEMP/embeds/"; done
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch --depth 1 origin main && git reset --hard origin/main
            [ -f "$RUNNER_TEMP/sns_video.json" ] && cp "$RUNNER_TEMP/sns_video.json" state/sns_video.json
            [ -f "$RUNNER_TEMP/video.json" ] && mkdir -p state/buffer_calls && cp "$RUNNER_TEMP/video.json" state/buffer_calls/video.json
            [ -f "$RUNNER_TEMP/claude_api_usage_video.json" ] && python scripts/llm.py --merge-api-usage "$RUNNER_TEMP/claude_api_usage_video.json" state/claude_api_usage_video.json
            [ -f "$RUNNER_TEMP/llm_usage_video.json" ] && python scripts/llm.py --merge-usage-counts "$RUNNER_TEMP/llm_usage_video.json" state/llm_usage_video.json && git add state/llm_usage_video.json
            # 動画つきで送った・出さなかった記録を、最新の投稿履歴（threads_posted.json）に写す（何度写しても同じ）
            python scripts/sns_video_followup.py --sync-posted || true
            git add state/threads_posted.json state/bluesky_extra.json 2>/dev/null
            # 記事の video だけを最新の記事 JSON に書き戻す（ほかの項目は main のまま）
            for f in "$RUNNER_TEMP"/embeds/*.json; do [ -f "$f" ] || continue
              python - "$f" "content/articles/$(basename "$f")" <<'PY'
          import json, sys
          src, dst = sys.argv[1], sys.argv[2]
          video = json.load(open(src)).get("video")
          art = json.load(open(dst))
          if video and art.get("video") != video:
              art["video"] = video
              open(dst, "w").write(json.dumps(art, ensure_ascii=False, indent=2) + "\n")
          PY
            done
            git add state/sns_video.json state/claude_api_usage_video.json content/articles 2>/dev/null
            [ -f state/buffer_calls/video.json ] && git add state/buffer_calls/video.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(video): SNS 動画の記録を更新 [no-deploy]"
            git push origin HEAD:main && exit 0
            sleep 5
          done
