name: Nightly Pricing & Events

# 毎晩 03:40 JST（18:40 UTC）に、定番ページのデータを更新する。
#   - scripts/events.py        … イベントの開催状況・関連記事・開催後の「発表内容」（/events）
#   - scripts/pricing_table.py … 新しい記事に出た料金を抽出して早見表を作り直す（/ai-pricing）
# 中身が変わったときだけコミットし、Cloudflare へデプロイする。
# イベントの日程・基調講演の時刻は content/events.json を手で直す（公式に確認できたものだけ）。
on:
  schedule:
    - cron: "40 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh events
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/events.py

      - name: Refresh pricing table
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/pricing_table.py --max 40

      - name: Commit & push
        id: commit
        run: |
          echo "deploy=0" >> "$GITHUB_OUTPUT"
          git checkout -- content/llm_usage.json 2>/dev/null || true
          if [ -z "$(git status --porcelain content/events.json content/pricing.json state/pricing_extract.json)" ]; then
            echo "変更なし"
            exit 0
          fi
          DEPLOY=0
          if [ -n "$(git status --porcelain content/events.json content/pricing.json)" ]; then DEPLOY=1; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/events.json content/pricing.json state/pricing_extract.json
          git commit -m "chore(assets): 料金早見表・イベントのデータを更新"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "deploy=${DEPLOY}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push に失敗しました。リトライ $i/3"
            sleep 5
          done
          echo "::error::push に3回失敗しました"
          exit 1

      - name: Deploy to Cloudflare
        if: ${{ steps.commit.outputs.deploy == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_cloudflare.yml --ref main
