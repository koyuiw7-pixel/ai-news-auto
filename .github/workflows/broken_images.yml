name: Broken image check

# 本番で読めない画像（壊れた画像アイコン）の見張り（scripts/check_images.py）。
# デプロイのあと・1時間ごとに、トップ・/articles・ジャンルのページ・新しい記事30本・新しい記事10本の /card/<slug> を開き、
# <img>・og:image の画像がすべて「200 で画像」かを確かめる。毎日1回は全記事のサムネイルも直接確かめる。
# 直せるもの（KV の WebP の置き直し・公式の写真の取り直し・外部サイトの直リンクの解消・選び直し）はその場で直し、
# 記事を書き換えたらコミットしてデプロイを呼ぶ。読めない画像の一覧は issue（ラベル broken-image）に書き、無くなったら閉じる。
on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "37 * * * *"   # 1時間ごと（ページの見回り）
    - cron: "52 18 * * *"  # 毎日 3:52（日本時間）全記事のサムネイル
  workflow_dispatch:
    inputs:
      articles:
        description: "全記事のサムネイルも確かめる"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: broken-image-check
  cancel-in-progress: false

jobs:
  check:
    # デプロイが成功したときだけ（失敗したデプロイの後は前の版のままなので、1時間ごとの回に任せる）
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check images (offline tests)
        run: python -m unittest tests.test_check_images

      - name: Check images on production
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # 直すとき（scripts/images.py と同じ鍵。KV への保存・選び直し）
          CF_KV_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          LLM_WORKFLOW: images  # 無料枠の取り分を数えるジョブ名（scripts/llm.py）
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FULL: ${{ github.event.schedule == '52 18 * * *' || inputs.articles == true }}
        run: |
          # デプロイ直後は新しい版が行き渡るまで少し待つ
          if [ "${{ github.event_name }}" = "workflow_run" ]; then sleep 45; fi
          status=0
          if [ "$FULL" = "true" ]; then
            python scripts/check_images.py --articles --fix || status=1
          fi
          python scripts/check_images.py --fix --issue --run-url "$RUN_URL" || status=1
          exit $status

      # 公開から1時間を過ぎて画像（写真・AI のイメージ）の無い記事の見張り（scripts/image_coverage.py・台帳 I9）。
      # あれば issue（ラベル missing-image）に一覧を書き、無くなれば閉じる
      - name: Missing image watch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/image_coverage.py --issue

      - name: Commit fixed articles and deploy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain content/articles)" ]; then
            echo "記事の書き換えなし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles
          git commit -m "fix(images): 読めない画像・外部の直リンクを直す（自動の見張り）"
          # 記事づくりの回（auto_run）が走っている間は待ってから push（同じ記事を同時に直さない）。ぶつかっても項目ごとにマージする
          if ! python3 scripts/git_safe_push.py --wait-idle auto_run.yml --wait-max 900; then
            echo "::error::push に失敗しました"; exit 1
          fi
          # GITHUB_TOKEN の push ではデプロイが起動しないので明示的に呼ぶ
          gh workflow run deploy_cloudflare.yml --ref main

      - name: Fail when broken images remain
        if: ${{ steps.check.outcome == 'failure' }}
        run: |
          echo "::warning::本番で読めない画像があります（issue: ラベル broken-image）"
          exit 1
