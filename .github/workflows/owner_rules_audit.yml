name: Owner rules audit (read only)

# オーナーのルールの毎日の点検（scripts/owner_rules_audit.py）。本番の新しい記事・固定ページ・Bluesky の直近の投稿を
# 読んで、台帳（docs/owner_rules.md）の番号ごとに違反を探し、issue（ラベル owner-rule-violation）にまとめる。
# 読むだけ: 投稿・削除・予約の変更・記事の書き換えは一切しない。Buffer も読まない（回数の節約）。
# 本番のページには X-Saisoku-Internal: 1 を付ける（自社アクセスとして数えない）。
on:
  schedule:
    - cron: "40 19 * * *" # 毎日 4:40（日本時間）。投稿・記事づくりの少ない時間
  workflow_dispatch:
    inputs:
      latest:
        description: "点検する新しい記事の数"
        default: "20"

permissions:
  contents: write  # Buffer の呼び出し回数の記録（state/buffer_calls）を残す
  issues: write

concurrency:
  group: owner-rules-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Audit production (nothing is posted or changed)
        env:
          GH_TOKEN: ${{ github.token }}
          SNS_RULES_NO_ISSUE: "1"
          # 二重投稿の点検（S20）に Buffer の投稿を読む（読むだけ・1日数回。回数の記録は state/buffer_calls/audit.json）
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LEDGER: audit
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
        run: python scripts/owner_rules_audit.py --latest "${{ inputs.latest || '20' }}" --issue --out out/owner_rules_audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owner-rules-audit-${{ github.run_id }}
          path: out/owner_rules_audit.json
          retention-days: 14
          if-no-files-found: ignore
      # Buffer の呼び出し回数を main に残す（30日の合計を全部のワークフローで数える。scripts/buffer_budget.py・2026-11-05）
      - name: Save Buffer call ledger
        if: ${{ always() }}
        continue-on-error: true
        run: |
          f=state/buffer_calls/audit.json
          if [ ! -f "$f" ] || [ -z "$(git status --porcelain "$f")" ]; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "chore(buffer): Buffer の呼び出し回数を記録 [no-deploy]"
          python3 scripts/git_safe_push.py
