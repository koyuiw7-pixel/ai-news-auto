name: SNS audit (read only)

# 実際に出た SNS 投稿（Buffer の Threads / X / Facebook と Bluesky の公開フィード）を読んで、
# scripts/sns_rules.py のルールに合わない投稿の候補を一覧にする。投稿・削除・予約の変更は一切しない。
# 結果（本文つき）は成果物 sns-audit-<番号> に3日だけ残す。ログには件数だけ。
on:
  workflow_dispatch:
    inputs:
      days:
        description: "何日前までを見るか"
        default: "4"

permissions:
  contents: write  # Buffer の呼び出し回数の記録（state/buffer_calls）を残す

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read posts (nothing is posted or deleted)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LEDGER: audit
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
        run: python scripts/sns_audit.py --days "${{ inputs.days || '4' }}" --out out/sns_audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sns-audit-${{ github.run_number }}
          path: out/sns_audit.json
          retention-days: 3
          if-no-files-found: ignore
      # Buffer の呼び出し回数を main に残す（30日の合計を全部のワークフローで数える。scripts/buffer_budget.py・2026-11-05）
      - name: Save Buffer call ledger
        if: ${{ always() }}
        continue-on-error: true
        run: |
          f=state/buffer_calls/audit.json
          if [ ! -f "$f" ] || [ -z "$(git status --porcelain "$f")" ]; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "chore(buffer): Buffer の呼び出し回数を記録 [no-deploy]"
          python3 scripts/git_safe_push.py
