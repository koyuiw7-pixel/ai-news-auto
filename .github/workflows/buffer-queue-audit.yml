name: Buffer queue audit (read only, encrypted)
on:
  workflow_dispatch:
    inputs:
      certificate_base64:
        description: Base64 encoded public certificate for encrypting the result
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read queue and encrypt result
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          AUDIT_RESULT: ${{ runner.temp }}/buffer-audit.json
          CERTIFICATE_BASE64: ${{ inputs.certificate_base64 }}
        run: |
          umask 077
          printf '%s' "$CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/audit-cert.pem"
          python3 scripts/buffer_queue_audit.py
          openssl cms -encrypt -aes-256-cbc -binary -outform DER -in "$AUDIT_RESULT" -out "$RUNNER_TEMP/buffer-audit.der" "$RUNNER_TEMP/audit-cert.pem"
          rm -f "$AUDIT_RESULT"
      - uses: actions/upload-artifact@v7
        with:
          name: buffer-queue-audit-encrypted
          path: ${{ runner.temp }}/buffer-audit.der
          retention-days: 1
          if-no-files-found: error
