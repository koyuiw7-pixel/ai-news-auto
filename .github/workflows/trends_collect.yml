name: Collect trends

# Googleトレンドの急上昇ワードは10件しか出ず入れ替わりが早いので、1時間ごとに拾って
# state/trend_queue.json に貯める（APIは使わない）。記事化は auto_run.yml がまとめて行う。
# state/ だけの変更は vercel.json の ignoreCommand により再ビルドされない。
on:
  schedule:
    # 予約は GitHub の都合で間引かれる（2026-11-01〜08 は1日に約4回）。30分おきに予約し、
    # 記事づくりの回（auto_run.yml、約20分おき）でも集める（台帳 A63）
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trends-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Enqueue trends
        run: python scripts/trends.py --enqueue
      - name: Commit queue
        run: |
          if [ -z "$(git status --porcelain state)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "chore(trends): 話題のキーワードを更新"
          python3 scripts/git_safe_push.py && exit 0
          echo "::warning::push に失敗しました"
