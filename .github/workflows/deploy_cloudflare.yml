name: Deploy to Cloudflare Workers

# サイトを Cloudflare Workers（OpenNext）へデプロイする。
# 自動の記事追加（GITHUB_TOKEN の push）では起動しないので、auto_run / angle_now が workflow_dispatch で呼ぶ。
# 人の push（コードの変更）は下の push で起動する。
#
# 必要なシークレット（Settings > Secrets and variables > Actions）:
#   CF_DEPLOY_TOKEN        …（記事生成の Workers AI 用 CLOUDFLARE_API_TOKEN とは別） 「Edit Cloudflare Workers」テンプレート + Workers KV Storage:Edit
#   CLOUDFLARE_ACCOUNT_ID  … Cloudflare のアカウント ID
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"

permissions:
  contents: read

# 連続でコミットされても最後の1回だけデプロイする
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # [no-deploy] の付いたコミットは飛ばす（auto_run.yml のデプロイまとめと同じ約束）
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[no-deploy]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run cf:build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
