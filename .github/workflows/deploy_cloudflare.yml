name: Deploy to Cloudflare Workers

# サイトを Cloudflare Workers（OpenNext）へデプロイする。
# 切り替えが済むまでは手動実行だけ。本番化するときは下の push を有効にする。
#
# 必要なシークレット（Settings > Secrets and variables > Actions）:
#   CLOUDFLARE_API_TOKEN   … 「Edit Cloudflare Workers」テンプレート + Workers KV Storage:Edit
#   CLOUDFLARE_ACCOUNT_ID  … Cloudflare のアカウント ID
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - "state/**"

permissions:
  contents: read

# 連続でコミットされても最後の1回だけデプロイする
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # [no-deploy] の付いたコミットは飛ばす（auto_run.yml のデプロイまとめと同じ約束）
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[no-deploy]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run cf:build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
