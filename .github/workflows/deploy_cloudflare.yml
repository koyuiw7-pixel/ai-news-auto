name: Deploy to Cloudflare Workers

# サイトを Cloudflare Workers（OpenNext）へデプロイする。
# 自動の記事追加（GITHUB_TOKEN の push）では起動しないので、auto_run / angle_now が workflow_dispatch で呼ぶ。
# 人の push（コードの変更）は下の push で起動する。
#
# 必要なシークレット（Settings > Secrets and variables > Actions）:
#   CF_DEPLOY_TOKEN        …（記事生成の Workers AI 用 CLOUDFLARE_API_TOKEN とは別） 「Edit Cloudflare Workers」テンプレート + Workers KV Storage:Edit
#   CLOUDFLARE_ACCOUNT_ID  … Cloudflare のアカウント ID
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"

# contents: write は、デプロイ後に公開時刻（state/live_log.json）を記録して push するため
permissions:
  contents: write

# 公開する回は最後の1回だけデプロイする。
# [no-deploy]の回は別groupへ。jobがskipでもworkflow concurrencyは先に評価されるため、
# 同じgroupだと記録だけのpushが進行中の公開まで取り消してしまう。
concurrency:
  group: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[no-deploy]') && format('deploy-skipped-{0}', github.run_id) || 'deploy-cloudflare' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # [no-deploy] の付いたコミットは飛ばす（auto_run.yml のデプロイまとめと同じ約束）
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[no-deploy]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify affiliate and guide measurement without external requests
        run: |
          node scripts/test_aff.mjs
          node --test tests/test_offer_time.cjs tests/test_offer_integrity.cjs tests/test_offer_relevance.cjs tests/test_story_topics.cjs tests/test_display_font_usage.cjs tests/test_owner_rules_site.cjs tests/test_source_pages_guides.cjs tests/test_related_articles.cjs tests/test_noir_layout.cjs
          python3 -m unittest tests/test_a8_pr_copy.py tests/test_action_ads.py tests/test_muse_japan_correction.py tests/test_inflow_report.py

      - name: Verify guide routing without external requests
        run: |
          node --test tests/test_howto_routing.cjs tests/test_guide_links.cjs tests/test_charts_calc.cjs tests/test_price_slot.cjs
          python3 -m unittest tests/test_article_charts.py tests/test_facts_bundle.py

      - name: Verify search eligibility and unchanged distribution
        run: |
          node --test tests/test_search_index_policy.cjs tests/test_verdict_label.cjs tests/test_site_search.cjs tests/test_headline_display.cjs tests/test_thumb_guard.cjs tests/test_autolink.cjs tests/test_site_coverage.cjs tests/test_digest_titles.cjs tests/test_title_source.cjs tests/test_company_labels.cjs tests/test_discover_meta.cjs
          python3 -m unittest tests.test_indexnow tests.test_publish_gate tests.test_headline_normalize tests.test_check_images tests.test_unescape_titles tests.test_genre_focus tests.test_llm_daily_caps tests.test_product_redirects

      - name: Verify article sections (empty sections hidden, headings rewritten; same rules in Python and TS)
        run: |
          node --test tests/test_article_sections.cjs tests/test_body_images.cjs tests/test_article_blocks.cjs tests/test_sns_official_photo.cjs tests/test_share_image_cover_20261107.cjs
          python3 -m unittest tests.test_section_gate tests.test_news_types tests.test_article_style tests.test_rewrite_types tests.test_pricing_scope

      - name: Verify one ad slot / newsletter signup per page and no "記載なし" shown to readers
        run: node --test tests/test_page_slots.cjs tests/test_no_data.cjs tests/test_products_hub.cjs tests/test_list_number.cjs tests/test_design_20261110.cjs tests/test_ad_ab_20261111.cjs tests/test_life_compare_guides.cjs tests/test_browser_guard_20261111.cjs

      - name: Verify official AI pricing with one FX rate, the 410 page layout and the breaking ticker (W21-W23)
        run: node --test tests/test_pricing_fx.cjs tests/test_gone_page.cjs tests/test_live_line.cjs

      - name: Verify every crawlable page is built ahead (no first-hit rendering after deploy, W29)
        run: |
          python3 -m unittest tests/test_cold_check.py
          node --test tests/test_worker_cache.cjs

      - name: Build
        run: npm run cf:build
        env:
          # AdSense の広告枠（components/AdSlot.tsx）。審査に通ったあと、管理画面で作った広告ユニットの ID を
          # GitHub の Variables に入れると、検索対象の記事だけに枠が出る。未設定（空）のあいだは枠を出さない
          NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_TOP: ${{ vars.ADSENSE_SLOT_ARTICLE_TOP }}
          NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_MIDDLE: ${{ vars.ADSENSE_SLOT_ARTICLE_MIDDLE }}
          NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR: ${{ vars.ADSENSE_SLOT_SIDEBAR }}

      # 下の「デプロイ直後の1回目の表示」の確かめで、新しい版に切り替わったかを見分けるため、今の版を控える
      - name: Remember the live version
        id: before
        continue-on-error: true
        run: echo "version=$(python3 scripts/cold_check.py version)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Cloudflare API の一時的なエラーで止まらないよう、最大3回やり直す
        run: |
          for i in 1 2 3; do
            npx opennextjs-cloudflare deploy && exit 0
            echo "::warning::デプロイ失敗（$i/3）。30秒後にやり直します"
            sleep 30
          done
          exit 1

      # 発表→公開の速さを測るため、開けるようになった記事の時刻を残す（scripts/latency.py。state/ はデプロイの対象外）
      # 失敗してもデプロイは成功のまま。待っている間に main が進んでいても衝突しないよう、最新の state に足して push する
      - name: Record live time
        continue-on-error: true
        run: |
          python3 scripts/latency.py record --wait 120 --out "$RUNNER_TEMP/live.json"
          if ! grep -q '"liveAt"' "$RUNNER_TEMP/live.json"; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python3 scripts/latency.py merge "$RUNNER_TEMP/live.json"
            git add state/live_log.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(latency): 記事の公開時刻を記録"
            git push origin HEAD:main && exit 0
            echo "push に失敗しました。リトライ $i/5"
            sleep 5
          done
          echo "::warning::公開時刻を push できませんでした（速さの集計から抜けるだけ）"

      # 検索エンジンに更新を通知する（IndexNow。アカウント不要で Bing などに直接届く。seo A2・LLMO-A3）。
      # 公開を確かめた（上の Record live time）あとに、デプロイした版の中身で、前と同じ中身のURLを除いて送る。
      # 送ったURLの指紋と HTTP の番号は state/indexnow_sent.json に残す（200/202 以外は scripts/pipeline_health.py --alert が issue にする）。
      # 失敗してもデプロイは成功のまま
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          git fetch -q origin main || true
          git checkout -q --detach "$GITHUB_SHA"
          git show origin/main:state/indexnow_sent.json > state/indexnow_sent.json 2>/dev/null || rm -f state/indexnow_sent.json
          set +e
          python3 scripts/indexnow.py --hours 12 --state-out "$RUNNER_TEMP/indexnow.json"
          code=$?
          set -e
          if [ ! -f "$RUNNER_TEMP/indexnow.json" ]; then exit $code; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python3 scripts/indexnow.py --merge-state "$RUNNER_TEMP/indexnow.json"
            git add state/indexnow_sent.json
            if git diff --cached --quiet; then exit $code; fi
            git commit -m "chore(indexnow): 検索エンジンに送ったURLを記録"
            git push origin HEAD:main && exit $code
            echo "push に失敗しました。リトライ $i/5"
            sleep 5
          done
          echo "::warning::IndexNow の記録を push できませんでした（次の回に同じURLを送り直すだけ）"
          exit $code

      # Google に RSS の更新を知らせる（WebSub。サイトマップは1〜2日に1回しか読まれないため。11/12）。
      # 公開を確かめたあとに送る。失敗してもデプロイは成功のまま
      - name: Notify WebSub hub
        continue-on-error: true
        run: python3 scripts/websub_ping.py

      # デプロイ直後の1回目の表示の速さ（台帳 W29。オーナー「デプロイ直後でもすぐ開けること」）。
      # サイトマップから選んだページをエッジのキャッシュに無い URL で開き、アクセスが来てから作ったページ（MISS）・
      # 2秒を超えたページ・開けないページがあれば赤にする（デプロイ自体は終わっている。知らせのため）
      - name: Check first hits right after deploy
        run: python3 scripts/cold_check.py check --previous "${{ steps.before.outputs.version }}" --n 30

      # 何も付けない URL（読者・検索のロボットが開く URL）のトップとサイトマップが、今の版で新しい記事を載せているか（seo A1）。
      # 報告だけ（デプロイを赤にしない）
      - name: Check plain URLs serve the new version
        if: always()
        continue-on-error: true
        run: python3 scripts/cold_check.py plain
