name: Threads publish now

# 手動実行専用。未投稿の新着記事を今すぐ Threads に投稿し、投稿履歴を記録する
# （THREADS_MODE=live のときだけ実際に投稿する）
on:
  workflow_dispatch:
    inputs:
      max:
        description: "投稿する最大本数"
        required: false
        default: "1"

permissions:
  contents: write
  issues: write  # SNS ルールの門番（scripts/sns_rules.py）が止めた投稿の issue（ラベル sns-rule-violation）

concurrency:
  group: auto-article-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # 待ちのあとでも最新の投稿の記録を読む（二重投稿よけ。S20）
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Post to Threads
        env:
          THREADS_MODE: ${{ vars.THREADS_MODE }}
          THREADS_TOKEN_KEY: ${{ secrets.THREADS_TOKEN_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GH_TOKEN: ${{ github.token }}  # 門番が止めた投稿の issue を立てる
          BUFFER_LEDGER: publish
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
          SNS_HOOK_FORMAT: ${{ vars.SNS_HOOK_FORMAT || '1' }}  # Muse の型の文面（2026-11-05 オーナー承認で既定 1。止めるなら変数を 0。台帳 S30）
        run: python scripts/threads_post.py --max "${{ github.event.inputs.max || '1' }}" --hours 48
      - name: Save posting history
        run: |
          if [ -z "$(git status --porcelain state)" ]; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "chore(threads): 投稿履歴を更新"
          python3 scripts/git_safe_push.py && exit 0
          echo "::warning::投稿履歴を push できませんでした"
