name: Facebook post

# Facebook ページ「サイソクニュース」だけの投稿（scripts/facebook_post.py・Buffer 経由）。2026-11-07 から Facebook だけの枠
# （日本時間 7:30・12:30＝暮らしの話題・20:00＝その日いちばん強い記事）に1本ずつ・1日3本まで（Threads・X と別に数える。台帳 S43）。
# 枠に遅れたら次の枠の前（最後は23時）までに出す。速報・災害の知らせは breaking_post.yml からすぐ（ここでも30分たって出ていない速報は拾う）。
# 枠の外・出すものが無い回は Buffer を呼ばない。GitHub の schedule は遅れたり飛んだりするため、10分ごと・枠の少しあと・記事の自動処理のあとにも動かす
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "33 22 * * *"  # 7:33 日本時間（朝の枠）
    - cron: "33 3 * * *"   # 12:33 日本時間（昼の枠）
    - cron: "3 11 * * *"   # 20:03 日本時間（夜の枠）
  workflow_run:
    workflows: ["Auto Article Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "文面の表示だけ（Buffer を呼ばない）"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write  # SNS ルールの門番（scripts/sns_rules.py）が止めた投稿の issue（ラベル sns-rule-violation）

concurrency:
  group: facebook-post
  cancel-in-progress: false

jobs:
  post:
    # workflow_run は同じリポジトリの main の処理が終わったときだけ（外部 PR からは動かさない）
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # きっかけの時点の古い commit ではなく、最新の記録を読む（二重投稿よけ）
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Post
        env:
          THREADS_MODE: ${{ vars.THREADS_MODE }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LEDGER: facebook
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
          BUFFER_DAILY_CAP: ${{ vars.BUFFER_DAILY_CAP }}
          FACEBOOK_PER_DAY: ${{ vars.FACEBOOK_PER_DAY }}  # 減らすときだけ（計画の15本より増やせない）
          SNS_PER_DAY: ${{ vars.SNS_PER_DAY }}  # 1日の通常の投稿の本数（2026-11-08〜 15。台帳 S47）
          GH_TOKEN: ${{ github.token }}  # 門番が止めた投稿の issue を立てる
        run: python scripts/facebook_post.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Commit history
        run: |
          if [ -z "$(git status --porcelain state)" ]; then exit 0; fi
          cp state/facebook_posted.json "$RUNNER_TEMP/mine_fb.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/mine_fb.json"
          cp state/buffer_calls/facebook.json "$RUNNER_TEMP/buffer_ledger.json" 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python scripts/facebook_post.py --merge "$RUNNER_TEMP/mine_fb.json"
            git add state/facebook_posted.json
            if [ -f "$RUNNER_TEMP/buffer_ledger.json" ]; then mkdir -p state/buffer_calls; cp "$RUNNER_TEMP/buffer_ledger.json" state/buffer_calls/facebook.json; git add state/buffer_calls/facebook.json; fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(facebook): 投稿を記録"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
