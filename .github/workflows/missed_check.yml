name: Missed news check

# 毎朝の見逃しチェック（オーナーの朝の確認の前・日本時間 8:30）。
# 前日〜今朝（直近30時間）の大きなニュース（Techmeme の river・Hacker News・ITmedia / Impress Watch / マイナビ / ゴリミー）のうち、
# サイソクに記事が無いものを一覧にして、ジョブのサマリーと Issue（ラベル missed-news。オーナーにメールが届く）に出す。
# 出典の候補（公式の発表、無ければ信頼できる報道）が見つかったものは state/radar_requests.json に足し、
# 見張り番の Worker のレーダーが数分以内に速報レーンへ回す（取りこぼしを自動で埋める）。
# 判定のルールは scripts/fast_lane_rules.json の radar（Worker と同じ）。Claude・Gemini は使わない（正規表現と取得だけ）
# 2026-11-02 から、他社・まとめの見出し（scripts/sources_registry.json の detect_feeds・radar_sources。AI・経済・国内・不動産・スポーツ）とも
# 突き合わせ、「他社が出してサイソクに記事が無い話題」を同じ Issue に並べる（一覧だけ。記事は一次情報を探してから作る）
# 2026-11-14 から、そのうち「自分は対象か」の事故（情報流出・回収・障害）の見出しは一覧で終わらせず、事故の見張り（scripts/incident_watch.py・台帳 W44）に
# 入れる: 会社自身のお知らせを探し、見つかれば速報レーンへ、無ければ話題のレーン（報道2社以上）へ。Issue には回した結果を書く
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "何時間前までの見出しを調べるか"
        required: false
        default: "30"
      request:
        description: "出典の候補が見つかったものを速報レーンに回す（1=回す）"
        required: false
        default: "1"

permissions:
  contents: write
  issues: write
  actions: write  # 事故の見張り（incident_watch.yml）をすぐ起こす

concurrency:
  group: missed-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 会社の「お詫びとお知らせ」の PDF を読む（事故の見張りが会社自身のお知らせを確かめる）
      - name: Install PDF reader
        continue-on-error: true
        run: pip install -q "pypdf>=5.0,<7" "cryptography>=42"

      - name: Check missed big stories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ARGS="--hours ${{ inputs.hours || '30' }} --issue"
          if [ "${{ inputs.request || '1' }}" = "1" ]; then ARGS="$ARGS --request"; fi
          python scripts/radar.py missed $ARGS

      # 新しいジャンル（新製品・ゲーム・ビジネスの公式・気象庁の地震・津波）の取りこぼし。サマリーに出すだけ（LLM なし・数件の取得だけ）
      - name: Check other genres
        continue-on-error: true
        run: |
          python scripts/fast_lane.py --missed-genres --hours "${{ inputs.hours || '30' }}"
          python scripts/quake.py --missed --hours "${{ inputs.hours || '30' }}"

      # 追加の発信元（scripts/sources_registry.json の AI 企業・AI につながる道具）の取りこぼしと、読めなくなったフィード。
      # サマリーに出すだけ（LLM なし・RSS を1回ずつ取得するだけ。一覧ページ（html）は Worker だけが読む）
      - name: Check source registry
        continue-on-error: true
        run: python scripts/fast_lane.py --missed-registry --hours "${{ inputs.hours || '30' }}"

      # 速報レーンへの依頼（state/radar_requests.json）を main に足す。待っている間に main が進んでいても衝突しないよう、最新に足し直す
      - name: Commit requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain state/radar_requests.json state/incident_watch.json state/trend_queue.json)" ]; then exit 0; fi
          cp state/radar_requests.json "$RUNNER_TEMP/requests.json"
          if [ -f state/incident_watch.json ]; then cp state/incident_watch.json "$RUNNER_TEMP/incident_watch.json"; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            cp "$RUNNER_TEMP/requests.json" state/radar_requests.json
            if [ -f "$RUNNER_TEMP/incident_watch.json" ]; then
              cp "$RUNNER_TEMP/incident_watch.json" state/incident_watch.json
              python scripts/incident_watch.py apply-press || true
            fi
            git add state/radar_requests.json
            if [ -f state/incident_watch.json ]; then git add state/incident_watch.json state/trend_queue.json; fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(radar): 見逃しチェックの速報レーンへの依頼"
            if git push origin HEAD:main; then
              # 事故の見張りに入れた話題を、次の予約を待たずに速報レーンへ回す
              gh workflow run incident_watch.yml --ref main || true
              exit 0
            fi
            echo "push に失敗しました。リトライ $i/5"
            sleep 5
          done
          echo "::warning::速報レーンへの依頼を push できませんでした（Issue の一覧を見て手動で対応してください）"
