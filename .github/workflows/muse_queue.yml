name: Muse video queue

# とろいも（Muse）に頼む動画を state/muse_queue.json に書く（台帳 S30）。2026-11-05 オーナー決定: SNS の予定に入った記事は全部（1日6本まで）。
# ふだんは記事の自動処理（auto_run の投稿の段）のあとに足す。ここは取りこぼしの拾いと期限切れの整理。
# 読むのは記事だけ。投稿はしない。Muse の動画の取り込みは Claude が対話の回で scripts/muse_ingest.py を使う。
on:
  schedule:
    - cron: "20 21,23,1,3,5,7,9,11 * * *"  # 6:20・8:20・10:20・12:20・14:20・16:20・18:20・20:20 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: muse-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pick Muse candidates
        run: python scripts/muse_queue.py
      - name: Save the queue
        run: |
          if [ -z "$(git status --porcelain state/muse_queue.json)" ]; then
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/muse_queue.json
          git commit -m "chore(muse): Muse に頼む動画の候補を更新 [no-deploy]"
          python3 scripts/git_safe_push.py
