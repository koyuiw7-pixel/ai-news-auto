name: Bluesky post

# Bluesky への投稿（scripts/bluesky_post.py）。Threads の通常の枠の約20分後・朝のまとめを出す。速報は breaking_post.yml からすぐ出す
# --fill: Threads 側に出すものがないときは、直近12時間の良い記事を1本（1日24本まで・通常は40分以上あける・深夜1〜5時は出さない）
# GitHub の schedule は数時間おきにしか動かないことがあるため、記事の自動処理（約20分ごと）が終わるたびにも動かす
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_run:
    workflows: ["Auto Article Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ログイン確認と下書き表示だけ"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write  # SNS ルールの門番（scripts/sns_rules.py）が止めた投稿の issue（ラベル sns-rule-violation）

concurrency:
  group: bluesky-post
  cancel-in-progress: false

jobs:
  post:
    # workflow_run は同じリポジトリの main の処理が終わったときだけ（外部 PR からは動かさない）
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # きっかけの時点の古い commit ではなく、最新の記録を読む（二重投稿よけ）
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Post
        env:
          THREADS_MODE: ${{ vars.THREADS_MODE }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SNS_HOOK_FORMAT: ${{ vars.SNS_HOOK_FORMAT || '1' }}  # Muse の型の文面（2026-11-05 オーナー承認で既定 1。止めるなら変数を 0。台帳 S30）
          THREADS_LINK_AB: ${{ vars.THREADS_LINK_AB || '1' }}  # Threads のリンクの位置の比べ（2026-11-05 オーナー承認・11/5〜11/12。S31）
          GH_TOKEN: ${{ github.token }}  # 門番が止めた投稿の issue を立てる
        run: python scripts/bluesky_post.py --fill ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Commit history
        run: |
          if [ -z "$(git status --porcelain state)" ]; then exit 0; fi
          cp state/threads_posted.json "$RUNNER_TEMP/mine.json"
          cp state/bluesky_extra.json "$RUNNER_TEMP/mine_extra.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/mine_extra.json"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python scripts/bluesky_post.py --merge "$RUNNER_TEMP/mine.json" --merge-extra "$RUNNER_TEMP/mine_extra.json"
            git add state/threads_posted.json state/bluesky_extra.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(bluesky): 投稿を記録"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
