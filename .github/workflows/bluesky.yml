name: Bluesky post

# Bluesky への投稿（scripts/bluesky_post.py）。2026-11-07 から Bluesky だけの枠（日本時間 7:30・13:00・21:00）に1本ずつ・1日3本まで
# （Threads と別に数える。台帳 S40）。枠に遅れたら次の枠の前（最後は23時）までに出す。ミサイル・災害の知らせは breaking_post.yml からすぐ
# GitHub の schedule は遅れたり飛んだりするため、10分ごと・枠の少しあと（UTC で書く）・記事の自動処理が終わるたびにも動かす（枠の外では何もしない）
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "33 22 * * *"  # 7:33 日本時間（朝の枠）
    - cron: "3 4 * * *"    # 13:03 日本時間（昼の枠）
    - cron: "3 12 * * *"   # 21:03 日本時間（夜の枠）
  workflow_run:
    workflows: ["Auto Article Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ログイン確認と下書き表示だけ"
        type: boolean
        default: true
      delete_approved:
        description: "（オーナー承認の出し直しだけ）この記事の前の Bluesky の投稿を消す（content/sns_reposts の deletedBlueskyUri）。空なら何もしない"
        default: ""

permissions:
  contents: write
  issues: write  # SNS ルールの門番（scripts/sns_rules.py）が止めた投稿の issue（ラベル sns-rule-violation）

concurrency:
  group: bluesky-post
  cancel-in-progress: false

jobs:
  post:
    # workflow_run は同じリポジトリの main の処理が終わったときだけ（外部 PR からは動かさない）
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # きっかけの時点の古い commit ではなく、最新の記録を読む（二重投稿よけ）
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Post
        env:
          THREADS_MODE: ${{ vars.THREADS_MODE }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SNS_HOOK_FORMAT: ${{ vars.SNS_HOOK_FORMAT || '1' }}  # Muse の型の文面（2026-11-05 オーナー承認で既定 1。止めるなら変数を 0。台帳 S30）
          GH_TOKEN: ${{ github.token }}  # 門番が止めた投稿の issue を立てる
        run: |
          if [ -n "${{ github.event.inputs.delete_approved }}" ]; then
            python scripts/bluesky_post.py --delete-approved "${{ github.event.inputs.delete_approved }}"
            exit $?
          fi
          python scripts/bluesky_post.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Commit history
        run: |
          if [ -z "$(git status --porcelain state)" ]; then exit 0; fi
          cp state/threads_posted.json "$RUNNER_TEMP/mine.json"
          cp state/bluesky_extra.json "$RUNNER_TEMP/mine_extra.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/mine_extra.json"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python scripts/bluesky_post.py --merge "$RUNNER_TEMP/mine.json" --merge-extra "$RUNNER_TEMP/mine_extra.json"
            git add state/threads_posted.json state/bluesky_extra.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(bluesky): 投稿を記録"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
