name: Readability check

# 文字の読みやすさのルール（docs/typography.md）を本番のページで確かめる。
# 人の push で走ったデプロイ（＝見た目のコードが変わったとき）の後だけ動く。
# 記事の自動追加（auto_run からの workflow_dispatch デプロイ）では動かさない（文字の組み方は変わらないため）。
# 違反があれば失敗にし、結果の JSON を成果物に残す。依存パッケージなし（ランナーの Chrome を使う）
on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  workflow_dispatch:
    inputs:
      paths:
        description: "調べるページ（カンマ区切り。空なら既定の主要ページ）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ジョブ単位にする（対象外で飛ばされた回が、走っている回を取り消さないように）
    concurrency:
      group: readability
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check readability on production
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PATHS: ${{ inputs.paths }}
        run: node scripts/check_readability.mjs --json readability.json --limit 40 ${PATHS:+--paths "$PATHS"}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: readability-report
          path: readability.json
          if-no-files-found: ignore
