name: Thicken short articles

# 本文の短い記事（空白を除いて 800字未満 → 1,500字未満の順）を、元の公式の資料の事実で厚くする（scripts/thicken_short.py。
# 2026-11-12 オーナー承認: AdSense の2回目の不承認「有用性の低いコンテンツ」。記事は消さない・短い記事を厚くする・約2週間は申請しない）。
# 1回目は無料モデル（llm.py の1日の上限・ジョブの取り分のまま）。品質ゲート（うそだけを落とす門）に落ちたら、今日の予算に余裕があるときだけ Sonnet。
# 合格して前より厚くなったときだけ保存。URL・題名・公開日時・続報・画像は変えない。SNS には何も出さない。
# 結果は state/thicken_short.json（厚くした・不合格の理由・資料が読めない）。同じ記事を何度も試さない。
on:
  # 1日3回・1回15本（日本時間 2:40・10:40・18:40。型の書き直し〔types_rewrite.yml・4:50〕と重ならない時間）
  schedule:
    - cron: "40 17,1,9 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "1回で厚くする記事の数"
        required: false
        default: "15"
      slugs:
        description: "この記事だけ（カンマ区切り。空なら短い順）"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

# 型の書き直しと同じ記事に同時に触らないよう、同じ順番待ちに並ぶ
concurrency:
  group: types-rewrite
  cancel-in-progress: false

jobs:
  thicken:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Thicken
        continue-on-error: true
        env:
          # 無料枠の取り分を数えるジョブ名（数の決まった無料モデルは記事・速報の分を残す。scripts/llm.py）
          LLM_WORKFLOW: thicken
          # API の使用額はこのジョブ専用のファイルに記録（手入れのジョブの回数として数える。予算はファイルの合計で見る）
          CLAUDE_API_LEDGER: thicken
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_API_MONTHLY_BUDGET_USD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          MAX: ${{ inputs.max || '15' }}
          SLUGS: ${{ inputs.slugs }}
        run: |
          timeout 4200 python -u scripts/thicken_short.py --apply --max "$MAX" --slug "$SLUGS" --budget-sec 3300 --report thicken_report.json
          python scripts/thicken_short.py --summary
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: thicken-report
          path: thicken_report.json
          if-no-files-found: ignore
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 公開と同じテスト（deploy_cloudflare.yml の unittest と node の行）を、push の前に通す。1つでも落ちたら push しない
      - name: Deploy tests before push
        id: tests
        run: python3 scripts/deploy_tests.py
      - name: Commit and deploy
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 無料枠の全体の回数（content/llm_usage.json）は記事の回が記録するので捨てる（push の衝突を避ける）。このジョブの分は state に残す
          git checkout -- content/llm_usage.json 2>/dev/null || true
          git add content/articles
          for f in state/thicken_short.json state/claude_api_usage_thicken.json state/llm_usage_thicken.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          N=$(git diff --cached --name-only -- 'content/articles/*.json' | wc -l | tr -d ' ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(content): 短い記事を公式の資料で厚くする（${N}本）"
          # 記事づくりの回（auto_run）が走っている間は push を待つ。ぶつかっても項目ごとにマージする（scripts/git_safe_push.py）
          if python3 scripts/git_safe_push.py --wait-idle auto_run.yml --wait-max 1200; then
            if [ "$N" != "0" ]; then gh workflow run deploy_cloudflare.yml --ref main; fi
            exit 0
          fi
          exit 1
