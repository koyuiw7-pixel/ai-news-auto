name: Auto Article Pipeline
# 速報レーンの回は「速報レーン <URL>」と表示する（見張り番の Worker がこの名前で自分の起動を見分ける）
run-name: ${{ (inputs.fast_url || '') != '' && format('速報レーン {0}', inputs.fast_url) || format('Auto Article Pipeline ({0})', inputs.mode || github.event_name) }}

on:
  schedule:
    # 6時間ごと（UTC基準）。量産と見なされるリスクとAPI消費を抑えるため
    # 3時間ごと3本(最大24本/日)から絞っている
    - cron: "7 */6 * * *"
    # 公式ブログ・プレスリリース・話題のニュースは20分ごとに少しずつ出す（まとめて出すより自然で、速報性も上がる）
    # 記事が増えた回だけコミットし、Vercel へのデプロイは1時間に1回にまとめる（Commit & push を参照）
    - cron: "15,35,55 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full=動画・まとめ・SNSも実行 / web=公式ブログ・プレスリリース・話題のみ（見張り番が使う）"
        required: false
        default: "full"
      max_articles:
        description: "1回で生成する最大記事数"
        required: false
        default: "2"
      days:
        description: "何日前までの動画を対象にするか"
        required: false
        default: "10"
      # 速報レーン（ops/watchdog の Worker が主要企業の公式発表を見つけたときに使う）。この記事だけを最初に作ってすぐデプロイする
      fast_url:
        description: "速報レーン: すぐ記事にする公式発表の URL（空なら通常の回）"
        required: false
        default: ""
      fast_meta:
        description: "速報レーン: Worker が渡す JSON（見出し・発表時刻・検知時刻・本文）"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

# 前の実行が走っている間は待機（同じ動画を二重処理しないため）
concurrency:
  group: auto-article-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # 最悪ケース: 記事2本×3試行×5分 + まとめ3試行×5分 ≒ 48分に収まる余裕を持たせる
    timeout-minutes: 60

    steps:
      # 起動した時点ではなく「いまの main」を取る（前の回の待ちのあいだに進んだ記事・state を見て二重に作らないため）
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secret
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::GEMINI_API_KEY が未設定です。gh secret set GEMINI_API_KEY を実行してください。"
            exit 1
          fi

      # 動画の解析は無料枠を多く使うので6時間ごとだけ
      - name: Generate articles
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'web') || github.event.schedule == '7 */6 * * *' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 未設定なら scripts/main.py の MODEL_CANDIDATES が自動で選択する
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python scripts/main.py \
            --max "${{ github.event.inputs.max_articles || '2' }}" \
            --days "${{ github.event.inputs.days || '10' }}"

      # 公式ブログ・プレスリリース（文章）と話題のニュース（Googleトレンド）から記事を作る。
      # 動画解析より軽いので、無料枠の大きい軽量モデルを順に使い回す（scripts/llm.py）。
      # 本数は変数で段階的に増やす: WEB_MAX_PER_RUN / TREND_MAX_PER_RUN / WEB_DAILY_CAP
      # 今日の上限（週ごとに少しずつ増やす予定表。GitHub の変数があればそちらを優先）
      - name: Decide today's limits
        id: ramp
        env:
          WEB_DAILY_CAP_OVERRIDE: ${{ vars.WEB_DAILY_CAP }}
          SNS_PER_DAY_OVERRIDE: ${{ vars.SNS_PER_DAY }}
          BROAD_MAX_PER_RUN_OVERRIDE: ${{ vars.BROAD_MAX_PER_RUN }}
        run: python scripts/ramp.py

      # Claude Code（オーナーの契約）を質重視の記事に使う。1日の上限は CLAUDE_DAILY_MAX
      - name: Install Claude Code CLI
        continue-on-error: true
        run: npm i -g @anthropic-ai/claude-code

      # 速報レーンの回（fast_url あり）は、その記事だけを quality で作る（scripts/web_articles.py の --fast-url）。
      # 通常の回は、速報レーンの実行が待っていると今の記事を作り終えたところで早めに終えて譲る
      - name: Generate web articles
        continue-on-error: true
        env:
          FAST_URL: ${{ inputs.fast_url }}
          FAST_META: ${{ inputs.fast_meta }}
          FAST_LANE_GH_TOKEN: ${{ github.token }}
          # 任意: 読み取りサービス（r.jina.ai）の鍵。openai.com の記事は直接読めないため、あると取りこぼしが減る
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_DAILY_MAX: ${{ vars.CLAUDE_DAILY_MAX || '40' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$FAST_URL" ]; then
            python scripts/web_articles.py --fast-url "$FAST_URL" --fast-meta "$FAST_META" --days 3
            exit 0
          fi
          python scripts/web_articles.py \
            --max "${{ vars.WEB_MAX_PER_RUN || '1' }}" \
            --max-broad "${{ steps.ramp.outputs.broad_per_run }}" \
            --trends "${{ vars.TREND_MAX_PER_RUN || '1' }}" \
            --daily-cap "${{ steps.ramp.outputs.web_daily_cap }}" \
            --days 3 --tier bulk

      # 同じ話題の記事が3本以上たまったら、横断まとめ記事に統合する。
      # 動画を再解析せず既存記事のテキストだけを使うのでAPI消費は1回分。
      - name: Build roundup
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'web') || github.event.schedule == '7 */6 * * *' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/roundup.py --max 1

      # 「試すなら」枠の本・価格を1日1回更新する（楽天ブックスの売れ筋と提携先の公式価格）
      - name: Refresh product picks
        if: ${{ (inputs.fast_url || '') == '' }}
        continue-on-error: true
        run: python scripts/rakuten_books.py --if-older-than 20

      # 比較ガイド（/compare）。未作成のものを1本ずつ作り、価格は7日ごとに公式ページで確認し直す
      - name: Buying guides
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'web') || github.event.schedule == '7 */6 * * *' }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_DAILY_MAX: ${{ vars.CLAUDE_DAILY_MAX || '40' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 比較ガイドは作り直し中のため、新規作成は止めて価格の確認だけ続ける
          python scripts/buying_guides.py --refresh --max-age 7

      # 製品のまとめページ（/products）。題名に出てくる記事が増えた製品だけ原稿を作り直す（軽量モデル・1回3件まで）。
      # 記事が変わらない回は LLM を呼ばない。時間の上限つきで、失敗しても記事の公開は止めない
      # 速報レーンの回は公開を急ぐので飛ばす（次の通常の回で作り直す）
      - name: Product hubs
        if: ${{ (inputs.fast_url || '') == '' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: timeout 540 python scripts/products.py --max 3 --budget 420 --tier bulk

      # 記事は毎回コミットするが、Vercel へのデプロイは1時間に1回にまとめる。
      # デプロイのたびに全ファイルの保存（Deployment Storage）と ISR キャッシュの作り直し
      # （Fast Origin Transfer）が発生するため、20分ごとに出すと無駄が大きい。
      # デプロイするのは「前回から55分以上」「6時間ごとの回」「手動実行（full）」のとき。
      # それ以外は "[no-deploy]" を付けてコミットし、scripts/vercel_ignore.sh がビルドを飛ばす。
      # 次にデプロイするコミットは HEAD をビルドするので、溜まった記事もまとめて公開される。
      # 記事が増えない回でも、保留中の記事があって55分たっていれば "[deploy]" の空コミットで公開する。
      # 前回のデプロイ時刻は state/last_deploy、保留の有無は state/deploy_pending（state/ はビルド対象外）
      # 速報（主要企業の公式発表。記事 JSON の breaking: true）を作った回は、待たずにデプロイして
      # breaking_post.yml を呼ぶ（デプロイ完了を待って Threads・X・Facebook にすぐ出す）
      - name: Commit & push
        id: commit
        env:
          FORCE_DEPLOY: ${{ github.event.schedule == '7 */6 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode || 'full') == 'full') || (inputs.fast_url || '') != '' }}
        run: |
          echo "count=0" >> "$GITHUB_OUTPUT"
          echo "deploy=0" >> "$GITHUB_OUTPUT"
          echo "breaking=0" >> "$GITHUB_OUTPUT"
          mkdir -p state
          NOW=$(date -u +%s)
          LAST=$(cat state/last_deploy 2>/dev/null | tr -cd '0-9')
          LAST=${LAST:-0}
          PENDING=$(cat state/deploy_pending 2>/dev/null | tr -cd '0-9')
          PENDING=${PENDING:-0}
          DUE=0
          if [ "$FORCE_DEPLOY" = "true" ] || [ $((NOW - LAST)) -ge 3300 ]; then DUE=1; fi
          echo "前回のデプロイから $(( (NOW - LAST) / 60 )) 分 / 保留=${PENDING} / 強制=${FORCE_DEPLOY} / デプロイ対象=${DUE}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 速報レーンの処理結果（Worker がこれを見て再起動をやめる）
          ACK=0
          if [ -n "$(git status --porcelain state/fast_lane.json)" ]; then ACK=1; fi
          if [ -n "$(git status --porcelain content)" ]; then
            git add content
            COUNT=$(git diff --cached --name-only --diff-filter=A -- 'content/articles/*.json' | wc -l | tr -d ' ')
            echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
            MSG="chore(content): 記事を自動生成・まとめを更新 (+${COUNT}本)"
            BREAKING=$(git diff --cached --name-only --diff-filter=A -- 'content/articles/*.json' \
              | xargs -r jq -r 'select(.breaking == true) | .slug' | tr '\n' ' ')
            if [ -n "$BREAKING" ]; then
              echo "速報の記事: ${BREAKING}→ すぐデプロイして即時投稿します"
              DUE=1
              echo "breaking=1" >> "$GITHUB_OUTPUT"
              MSG="${MSG} 速報"
            fi
            if [ "$DUE" = "1" ]; then
              echo "$NOW" > state/last_deploy
              echo 0 > state/deploy_pending
              echo "deploy=1" >> "$GITHUB_OUTPUT"
            else
              echo 1 > state/deploy_pending
              MSG="${MSG} [no-deploy]"
            fi
          elif [ "$PENDING" = "1" ] && [ "$DUE" = "1" ]; then
            # 記事は増えていないが、前の回で保留した記事を公開する
            echo "$NOW" > state/last_deploy
            echo 0 > state/deploy_pending
            echo "deploy=1" >> "$GITHUB_OUTPUT"
            MSG="chore(deploy): 保留中の記事を公開 [deploy]"
          elif [ "$ACK" = "1" ]; then
            MSG="chore(fast): 速報レーンの処理結果を記録"
          else
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git add state/last_deploy state/deploy_pending
          if [ -f state/fast_lane.json ]; then git add state/fast_lane.json; fi
          git commit -m "$MSG"
          # 実行中に main が進んでいても失敗しないよう rebase してから push（最大3回）
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push に失敗しました。リトライ $i/3"
            sleep 5
          done
          echo "::error::push に3回失敗しました"
          exit 1

      # Cloudflare へデプロイする（GITHUB_TOKEN の push では他のワークフローが起動しないため、明示的に呼ぶ）
      - name: Deploy to Cloudflare
        if: ${{ steps.commit.outputs.deploy == '1' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_cloudflare.yml --ref main

      # 速報の即時投稿（breaking_post.yml が、記事と図解カードが 200 になるのを待って出す）
      - name: Trigger breaking post
        if: ${{ steps.commit.outputs.breaking == '1' && steps.commit.outputs.deploy == '1' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run breaking_post.yml --ref main

      # 検索エンジンに更新を通知する（IndexNow）。
      # Search Console と違いアカウント不要で、Bing/DuckDuckGo などに直接届く。
      # 公開前の URL を通知しないよう、デプロイする回だけ送る（--hours 12 なので保留していた記事も含まれる）
      - name: Notify IndexNow
        if: ${{ steps.commit.outputs.deploy == '1' }}
        continue-on-error: true
        run: python scripts/indexnow.py --hours 12

      # 新着記事を Threads に投稿する（公式APIは無料）。
      # 変数 THREADS_MODE が live 以外なら、下書きをサマリーに出すだけで何も公開しない。
      # 新着が無い回も走らせ、未投稿分の再挑戦とトークンの期限延長を行う。
      # state/ だけの変更は vercel.json の ignoreCommand により再ビルドされない。
      # Buffer の無料枠（1日250リクエスト）を守るため、SNS の予約は6時間ごとの回だけ行う
      # （8時間先までの枠をまとめて予約するので、6時間ごとで足りる）
      - name: Post to Threads
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'web') || github.event.schedule == '7 */6 * * *' }}
        continue-on-error: true
        env:
          THREADS_MODE: ${{ vars.THREADS_MODE }}
          THREADS_TOKEN_KEY: ${{ secrets.THREADS_TOKEN_KEY }}
          # Buffer 経由で投稿する場合の API キー（設定されていればこちらを優先）
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # 1日の投稿本数（Threads・X・Facebook 共通）。凍結を避けて週に1〜2本ずつ増やす
          SNS_PER_DAY: ${{ steps.ramp.outputs.sns_per_day }}
          # 速報の即時投稿の1日の上限（別枠・最大5）。速報待ちの記事を通常の予約に回さない判定に使う
          BREAKING_PER_DAY: ${{ vars.BREAKING_PER_DAY }}
        run: |
          # 投稿ごとの反応を取り込んで「勝ちパターン」を学び直してから、次の投稿を選ぶ
          # 反応の学習は1日1回（Buffer の数値も1日1回更新）
          if [ "$(date -u +%H)" = "00" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/threads_learn.py || echo "::warning::Threads の学習に失敗しました（投稿は続けます）"
          fi
          python scripts/threads_post.py --max 2
          if [ -z "$(git status --porcelain state)" ]; then
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "chore(threads): 投稿履歴を更新"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push に失敗しました。リトライ $i/3"
            sleep 5
          done
          echo "::warning::Threads の投稿履歴を push できませんでした（次回、同じ記事を二重投稿する恐れがあります）"

      # 連携先の管理システムへ生成完了を通知する。
      # WEBHOOK_URL が未設定なら何もしない（設定した時点で有効になる）。
      - name: Notify integration webhook
        if: ${{ steps.commit.outputs.count != '0' }}
        env:
          WEBHOOK_URL: ${{ secrets.INTEGRATION_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.INTEGRATION_WEBHOOK_SECRET }}
          COUNT: ${{ steps.commit.outputs.count }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "INTEGRATION_WEBHOOK_URL 未設定のため通知をスキップします。"
            exit 0
          fi
          TOTAL=$(ls -1 content/articles/*.json 2>/dev/null | wc -l | tr -d ' ')
          BODY=$(jq -nc \
            --arg count "$COUNT" --arg total "$TOTAL" \
            --arg run "$GITHUB_RUN_ID" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event:"articles.generated", created:($count|tonumber), total:($total|tonumber), runId:$run, occurredAt:$at}')
          # 改ざん検知のため HMAC-SHA256 署名を付ける（受信側で同じ鍵で検証）
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r | cut -d' ' -f1)
          curl -sS --fail-with-body --retry 3 --retry-delay 5 -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Saisoku-Signature: sha256=$SIG" \
            -d "$BODY" && echo "通知しました (+${COUNT}本)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 自動生成パイプライン"
            echo ""
            echo "- 記事総数: $(ls -1 content/articles/*.json 2>/dev/null | wc -l | tr -d ' ')"
            echo "- 実行時刻: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            python scripts/latency.py report --days 7 --markdown || true
          } >> "$GITHUB_STEP_SUMMARY"
