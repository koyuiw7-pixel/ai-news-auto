name: Auto Article Pipeline

on:
  schedule:
    # 6時間ごと（UTC基準）。量産と見なされるリスクとAPI消費を抑えるため
    # 3時間ごと3本(最大24本/日)から絞っている
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_articles:
        description: "1回で生成する最大記事数"
        required: false
        default: "2"
      days:
        description: "何日前までの動画を対象にするか"
        required: false
        default: "10"

permissions:
  contents: write

# 前の実行が走っている間は待機（同じ動画を二重処理しないため）
concurrency:
  group: auto-article-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # 最悪ケース: 記事2本×3試行×5分 + まとめ3試行×5分 ≒ 48分に収まる余裕を持たせる
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secret
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::GEMINI_API_KEY が未設定です。gh secret set GEMINI_API_KEY を実行してください。"
            exit 1
          fi

      - name: Generate articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 未設定なら scripts/main.py の MODEL_CANDIDATES が自動で選択する
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python scripts/main.py \
            --max "${{ github.event.inputs.max_articles || '2' }}" \
            --days "${{ github.event.inputs.days || '10' }}"

      # 公式ブログ・プレスリリース（文章）と話題のニュース（Googleトレンド）から記事を作る。
      # 動画解析より軽いので、無料枠の大きい軽量モデルを順に使い回す（scripts/llm.py）。
      # 本数は変数で段階的に増やす: WEB_MAX_PER_RUN / TREND_MAX_PER_RUN / WEB_DAILY_CAP
      - name: Generate web articles
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/web_articles.py \
            --max "${{ vars.WEB_MAX_PER_RUN || '3' }}" \
            --trends "${{ vars.TREND_MAX_PER_RUN || '1' }}" \
            --daily-cap "${{ vars.WEB_DAILY_CAP || '14' }}" \
            --days 3 --tier bulk

      # 同じ話題の記事が3本以上たまったら、横断まとめ記事に統合する。
      # 動画を再解析せず既存記事のテキストだけを使うのでAPI消費は1回分。
      - name: Build roundup
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/roundup.py --max 1

      # 「試すなら」枠の本・価格を1日1回更新する（楽天ブックスの売れ筋と提携先の公式価格）
      - name: Refresh product picks
        continue-on-error: true
        run: python scripts/rakuten_books.py --if-older-than 20

      - name: Commit & push
        id: commit
        run: |
          echo "count=0" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain content)" ]; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          COUNT=$(git diff --cached --name-only --diff-filter=A -- 'content/articles/*.json' | wc -l | tr -d ' ')
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          git commit -m "chore(content): 記事を自動生成・まとめを更新 (+${COUNT}本)"
          # 実行中に main が進んでいても失敗しないよう rebase してから push（最大3回）
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push に失敗しました。リトライ $i/3"
            sleep 5
          done
          echo "::error::push に3回失敗しました"
          exit 1

      # 検索エンジンに更新を通知する（IndexNow）。
      # Search Console と違いアカウント不要で、Bing/DuckDuckGo などに直接届く。
      - name: Notify IndexNow
        if: ${{ steps.commit.outputs.count != '0' }}
        continue-on-error: true
        run: python scripts/indexnow.py --hours 12

      # 新着記事を Threads に投稿する（公式APIは無料）。
      # 変数 THREADS_MODE が live 以外なら、下書きをサマリーに出すだけで何も公開しない。
      # 新着が無い回も走らせ、未投稿分の再挑戦とトークンの期限延長を行う。
      # state/ だけの変更は vercel.json の ignoreCommand により再ビルドされない。
      - name: Post to Threads
        continue-on-error: true
        env:
          THREADS_MODE: ${{ vars.THREADS_MODE }}
          THREADS_TOKEN_KEY: ${{ secrets.THREADS_TOKEN_KEY }}
          # Buffer 経由で投稿する場合の API キー（設定されていればこちらを優先）
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          # 投稿ごとの反応を取り込んで「勝ちパターン」を学び直してから、次の投稿を選ぶ
          python scripts/threads_learn.py || echo "::warning::Threads の学習に失敗しました（投稿は続けます）"
          python scripts/threads_post.py --max 2
          if [ -z "$(git status --porcelain state)" ]; then
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "chore(threads): 投稿履歴を更新"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push に失敗しました。リトライ $i/3"
            sleep 5
          done
          echo "::warning::Threads の投稿履歴を push できませんでした（次回、同じ記事を二重投稿する恐れがあります）"

      # 連携先の管理システムへ生成完了を通知する。
      # WEBHOOK_URL が未設定なら何もしない（設定した時点で有効になる）。
      - name: Notify integration webhook
        if: ${{ steps.commit.outputs.count != '0' }}
        env:
          WEBHOOK_URL: ${{ secrets.INTEGRATION_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.INTEGRATION_WEBHOOK_SECRET }}
          COUNT: ${{ steps.commit.outputs.count }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "INTEGRATION_WEBHOOK_URL 未設定のため通知をスキップします。"
            exit 0
          fi
          TOTAL=$(ls -1 content/articles/*.json 2>/dev/null | wc -l | tr -d ' ')
          BODY=$(jq -nc \
            --arg count "$COUNT" --arg total "$TOTAL" \
            --arg run "$GITHUB_RUN_ID" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event:"articles.generated", created:($count|tonumber), total:($total|tonumber), runId:$run, occurredAt:$at}')
          # 改ざん検知のため HMAC-SHA256 署名を付ける（受信側で同じ鍵で検証）
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r | cut -d' ' -f1)
          curl -sS --fail-with-body --retry 3 --retry-delay 5 -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Saisoku-Signature: sha256=$SIG" \
            -d "$BODY" && echo "通知しました (+${COUNT}本)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 自動生成パイプライン"
            echo ""
            echo "- 記事総数: $(ls -1 content/articles/*.json 2>/dev/null | wc -l | tr -d ' ')"
            echo "- 実行時刻: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
