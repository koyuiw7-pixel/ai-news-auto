name: Auto Article Pipeline
# 速報レーンの回は「速報レーン <URL>」と表示する（見張り番の Worker がこの名前で自分の起動を見分ける）
run-name: ${{ (inputs.fast_url || '') != '' && format('速報レーン {0}', inputs.fast_url) || format('Auto Article Pipeline ({0})', inputs.mode || github.event_name) }}

on:
  schedule:
    # 6時間ごと（UTC基準）。量産と見なされるリスクとAPI消費を抑えるため
    # 3時間ごと3本(最大24本/日)から絞っている
    - cron: "7 */6 * * *"
    # 公式ブログ・プレスリリース・話題のニュースは少しずつ出す（まとめて出すより自然で、速報性も上がる）
    # 2026-11-09 オーナー「100本/日は必須」: 日本時間 6:00〜24:00 は15分ごと（UTC 21〜23時・0〜14時）、深夜は20分ごと。
    # 前の回が走っている間の予約は1つだけ待ち（concurrency）、終わりしだい続けて動く。見張り番の Worker（ops/watchdog）も同じ間隔で起こす
    # 記事が増えた回だけコミットし、デプロイは1時間に1回にまとめる（Commit & push を参照）
    - cron: "4,19,34,49 21-23,0-14 * * *"
    - cron: "15,35,55 15-20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full=動画・まとめ・SNSも実行 / web=公式ブログ・プレスリリース・話題のみ（見張り番が使う）"
        required: false
        default: "full"
      max_articles:
        description: "1回で生成する最大記事数"
        required: false
        default: "2"
      days:
        description: "何日前までの動画を対象にするか"
        required: false
        default: "10"
      # 速報レーン（ops/watchdog の Worker が主要企業の公式発表を見つけたときに使う）。この記事だけを最初に作ってすぐデプロイする
      fast_url:
        description: "速報レーン: すぐ記事にする公式発表の URL（空なら通常の回）"
        required: false
        default: ""
      fast_meta:
        description: "速報レーン: Worker が渡す JSON（見出し・発表時刻・検知時刻・本文）"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  issues: write  # 記事づくりが止まったときの issue（scripts/pipeline_health.py）

# 前の実行が走っている間は待機（同じ動画を二重処理しないため）
concurrency:
  group: auto-article-pipeline
  cancel-in-progress: false

env:
  # Threads の記事のリンクの位置（2026-11-06 テストの日・オーナー承認・台帳 S31/S39）。reply＝本文はリンク無し＋返信にリンク、body＝本文の最後。
  # 空なら body（11/5 の決まり）。切り替えは Actions の Variables の THREADS_LINK_POS だけ（予約中の投稿も出る前の読み直しで今の位置に直る）
  THREADS_LINK_POS: ${{ vars.THREADS_LINK_POS || 'body' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    # 最悪ケース: 記事2本×3試行×5分 + まとめ3試行×5分 ≒ 48分に収まる余裕を持たせる
    timeout-minutes: 60

    steps:
      # 起動した時点ではなく「いまの main」を取る（前の回の待ちのあいだに進んだ記事・state を見て二重に作らないため）
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt imageio-ffmpeg  # imageio-ffmpeg: scripts/images.py が公式動画のコマを取る

      # 速報レーン: PDF の資料（決算短信など）の表の数字を落とさないよう poppler の pdftotext を入れる（scripts/pdf_text.py・台帳 W35）
      - name: Install poppler (fast lane)
        if: ${{ (inputs.fast_url || '') != '' }}
        continue-on-error: true
        run: (command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)) >/dev/null && pdftotext -v 2>&1 | head -1

      - name: Check secret
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::GEMINI_API_KEY が未設定です。gh secret set GEMINI_API_KEY を実行してください。"
            exit 1
          fi

      # 動画の解析は無料枠を多く使うので6時間ごとだけ
      - name: Generate articles
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'web') || github.event.schedule == '7 */6 * * *' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 未設定なら scripts/main.py の MODEL_CANDIDATES が自動で選択する
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python scripts/main.py \
            --max "${{ github.event.inputs.max_articles || '2' }}" \
            --days "${{ github.event.inputs.days || '10' }}"

      # 公式ブログ・プレスリリース（文章）と話題のニュース（Googleトレンド）から記事を作る。
      # 動画解析より軽いので、無料枠の大きい軽量モデルを順に使い回す（scripts/llm.py）。
      # 本数は変数で段階的に増やす: WEB_MAX_PER_RUN / TREND_MAX_PER_RUN / WEB_DAILY_CAP_BRAKE（止めるときだけ）
      # 今日の上限（週ごとに少しずつ増やす予定表。GitHub の変数があればそちらを優先）
      - name: Decide today's limits
        id: ramp
        env:
          # 2026-11-06 オーナー決定（台帳 A47）: 100本/日。古い変数 WEB_DAILY_CAP（80）は読まない。止めるときは WEB_DAILY_CAP_BRAKE を設定する
          WEB_DAILY_CAP_OVERRIDE: ${{ vars.WEB_DAILY_CAP_BRAKE }}
          # 2026-11-08 台帳 A58: 100本へは段階を踏む（40→60→80→100）。今の段は変数 WEB_STAGE_TARGET（未設定なら 60）
          WEB_STAGE_TARGET: ${{ vars.WEB_STAGE_TARGET }}
          SNS_PER_DAY_OVERRIDE: ${{ vars.SNS_PER_DAY }}
          BROAD_MAX_PER_RUN_OVERRIDE: ${{ vars.BROAD_MAX_PER_RUN }}
          # 2026-11-09 オーナー「100本/日は必須」: AI のレーンの1回あたり（未設定なら上限 100本/日で2本。遅れていれば web_articles が自動で足す）
          AI_MAX_PER_RUN_OVERRIDE: ${{ vars.WEB_MAX_PER_RUN }}
        run: python scripts/ramp.py

      # Claude Code（オーナーの契約）を質重視の記事に使う。1日の上限は CLAUDE_DAILY_MAX
      # 地震・津波の回（気象庁の電文）は LLM を使わないので入れない（公開を急ぐ）
      - name: Install Claude Code CLI
        if: ${{ !startsWith(inputs.fast_url || '', 'https://www.data.jma.go.jp/') }}
        continue-on-error: true
        run: npm i -g @anthropic-ai/claude-code

      # Muse（Meta の AI の書き手）の入稿（content/muse_inbox/）は 2026-11-09 から muse_inbox.yml（別の concurrency）で審査・公開する。
      # ここで動かすと1回およそ14分のびて記事づくりの回数が減っていたため（オーナー「100本/日は必須」）。
      # 公開した分は同じく content/state.json の processed_web に入り、この回の web_articles の今日の本数（段の上限）に数えられる

      # いま検索で急上昇している話題を、記事を作る直前に取り直す（2026-11-08 台帳 A63）。
      # trends_collect.yml の毎時の予約は GitHub の都合で1日4回ほどしか動かなかったため、約20分おきに動くこの回でも集める。
      # Googleトレンドの RSS を1回読むだけ（無料・API なし）。失敗しても記事づくりは止めない
      - name: Refresh search trends
        if: ${{ (inputs.fast_url || '') == '' }}
        continue-on-error: true
        run: timeout 120 python scripts/trends.py --enqueue

      # 速報レーンの回（fast_url あり）は、その記事だけを quality で作る（scripts/web_articles.py の --fast-url）。
      # 通常の回は、速報レーンの実行が待っていると今の記事を作り終えたところで早めに終えて譲る
      - name: Generate web articles
        id: web
        continue-on-error: true
        env:
          LLM_WORKFLOW: ${{ (inputs.fast_url || '') != '' && 'breaking' || 'articles' }}  # 無料枠の取り分を数えるジョブ名（scripts/llm.py）
          FAST_URL: ${{ inputs.fast_url }}
          FAST_META: ${{ inputs.fast_meta }}
          FAST_LANE_GH_TOKEN: ${{ github.token }}
          # AdSense の審査の期間（11/12〜11/26）は海外の AI の発表を0本に（scripts/ramp.py の ADSENSE_REVIEW）
          FOREIGN_AI_DAILY_CAP: ${{ steps.ramp.outputs.foreign_ai_cap || '1000' }}
          # 任意: 読み取りサービス（r.jina.ai）の鍵。openai.com の記事は直接読めないため、あると取りこぼしが減る
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          # Claude API のクレジットを月の予算いっぱいまで、段ごとのモデルで使う（速報・SNS・中心=Sonnet、ほか=Haiku。Opus は使わない。
          # 予算に合わせて自動で上下）。だめなら速報・SNS は Claude CLI、そのあと無料モデル。仕組みは scripts/llm.py
          # 予算は GitHub の変数 CLAUDE_API_MONTHLY_BUDGET_USD（未設定なら $95。Ultra にしたら 190 くらい）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_API_MONTHLY_BUDGET_USD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_DAILY_MAX: ${{ vars.CLAUDE_DAILY_MAX || '40' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 地震・津波（気象庁の電文）は LLM を使わず決まった書式で作る（scripts/quake.py。続報は同じ記事を書き直す）
          case "$FAST_URL" in
            https://www.data.jma.go.jp/*)
              python scripts/quake.py --fast-url "$FAST_URL" --fast-meta "$FAST_META"
              exit 0 ;;
          esac
          if [ -n "$FAST_URL" ]; then
            python scripts/web_articles.py --fast-url "$FAST_URL" --fast-meta "$FAST_META" --days 3
            exit 0
          fi
          python scripts/web_articles.py \
            --max "${{ vars.WEB_MAX_PER_RUN || steps.ramp.outputs.ai_per_run || '1' }}" \
            --max-broad "${{ steps.ramp.outputs.broad_per_run }}" \
            --trends "${{ vars.TREND_MAX_PER_RUN || '1' }}" \
            --daily-cap "${{ steps.ramp.outputs.web_daily_cap }}" \
            --days 3 --tier bulk

      # 救済モードの最後の手（2026-11-06 オーナー「止まらない仕組み」・台帳 A48）: 前の回から0本が続き、この回もニュースの記事が
      # できなかったら、使い方ガイド（公式ページが出典・同じ品質の門）を1本作るよう evergreen.yml に依頼する（同じガイドの二重作成は evergreen の concurrency で防ぐ）
      - name: Rescue with an evergreen guide
        if: ${{ steps.web.outputs.rescue_evergreen == '1' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run evergreen.yml --ref main -f max=1 -f prefer=procedure && echo "暮らしとお金の手続きのガイドを先に1本作るよう依頼しました（台帳 A70）"

      # 同じ話題の記事が3本以上たまったら、横断まとめ記事に統合する。
      # 動画を再解析せず既存記事のテキストだけを使うのでAPI消費は1回分。
      - name: Build roundup
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'web') || github.event.schedule == '7 */6 * * *' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/roundup.py --max 1

      # 商品・価格の更新は product_refresh.yml で1日1回行う。
      # 取得先の障害や再試行で、記事の公開・後続の記事生成を待たせない。

      # 比較ガイド（/compare）。未作成のものを1本ずつ作り、価格は7日ごとに公式ページで確認し直す
      - name: Buying guides
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'web') || github.event.schedule == '7 */6 * * *' }}
        continue-on-error: true
        env:
          LLM_WORKFLOW: guides  # 無料枠の取り分を数えるジョブ名（scripts/llm.py）
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_DAILY_MAX: ${{ vars.CLAUDE_DAILY_MAX || '40' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Claude API の Haiku（その他の段）→ 無料モデル。使用量は記事と同じ state/claude_api_usage.json（同じジョブの中なので衝突しない）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_API_MONTHLY_BUDGET_USD }}
          LLM_DEFAULT_PURPOSE: rest
        run: |
          # 比較ガイドは作り直し中のため、新規作成は止めて価格の確認だけ続ける
          python scripts/buying_guides.py --refresh --max-age 7

      # 製品のまとめページ（/products）。題名に出てくる記事が増えた製品だけ原稿を作り直す（軽量モデル・1回3件まで）。
      # 記事が変わらない回は LLM を呼ばない。時間の上限つきで、失敗しても記事の公開は止めない
      # 速報レーンの回は公開を急ぐので飛ばす（次の通常の回で作り直す）
      - name: Product hubs
        if: ${{ (inputs.fast_url || '') == '' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          LLM_WORKFLOW: products  # 無料枠の取り分を数えるジョブ名（scripts/llm.py）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: timeout 540 python scripts/products.py --max 3 --budget 420 --tier bulk

      # 製品の記事の「同じクラスの製品と比べると？」（scripts/rivals.py）。ライバル2〜3つの仕様と価格を、各社の公式ページから読み取って表にする。
      # 記事を作る段で時間が足りなかった記事・速報レーンで作った記事をここで拾う（無料モデルだけ・1回2本まで）。
      # 公式ページが読めない・確認画面が出るライバルは飛ばす。調べた記事は state/rivals_checked.json に残して調べ直さない
      - name: Rival comparison
        if: ${{ (inputs.fast_url || '') == '' }}
        continue-on-error: true
        timeout-minutes: 7
        env:
          LLM_WORKFLOW: products  # 無料枠の取り分を数えるジョブ名（scripts/llm.py）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: timeout 380 python scripts/rivals.py --recent-hours 36 --max 2 --budget 300 --apply

      # 新しい記事の章の見出しを記事ごとの言葉にし、水増しの文を締める（scripts/section_polish.py。無料モデル・1記事1回）。
      # 本文 JSON の章名は変えず、表示用の見出しを sectionTitles に保存する（lib/article-sections.ts が表示で使う）。
      # 書き直しは数字・名前が残っているかをプログラムで確かめてから差し替える。間に合わない記事は次の回で拾う
      - name: Section headings
        if: ${{ (inputs.fast_url || '') == '' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          LLM_WORKFLOW: products
          # Haiku（purpose=helper。月の予算の配分の中で）→ だめなら無料モデル
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_API_MONTHLY_BUDGET_USD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: timeout 320 python scripts/section_polish.py --recent-hours 24 --max 6 --apply --purpose helper

      # 記事を一歩深くする欄（scripts/depth_fields.py。2026-11-09 オーナー指摘・台帳 A66）: 公式ページを読み直し、
      # 「なるほど」・公式窓口（URL と辿り方）・手順つきの「すぐにできること」・なぜ起きた・不安への答えを足す。
      # 数字・「」の名前・URL は読んだページにあるものだけ残す（プログラムで照合）。間に合わない記事は次の回で拾う
      - name: Article depth
        if: ${{ (inputs.fast_url || '') == '' }}
        continue-on-error: true
        timeout-minutes: 7
        env:
          LLM_WORKFLOW: products
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_API_MONTHLY_BUDGET_USD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: timeout 380 python scripts/depth_fields.py --recent-hours 24 --max 5 --budget 320 --apply --purpose helper

      # 記事の8つの基準（scripts/quality_bar.py。2026-11-12 オーナー「量を超えることができるレベルの最高の記事」）:
      # 速報・大きなニュースは基準に足りなくても止めずに出し（repairLater）、30分たってから公式の資料を読み直して1回だけ手直しする。
      # 手直しはふつうの事実確認（嘘だけを落とす門）に合格したときだけ書き込む。1本につき1回だけ
      - name: Quality bar repair later
        if: ${{ (inputs.fast_url || '') == '' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LLM_WORKFLOW: products
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_API_MONTHLY_BUDGET_USD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: timeout 280 python scripts/quality_bar.py --repair-later --max 2 --apply

      # 記事の写真（scripts/images.py）。元記事の写真が無い・ロゴだけの記事に、フリー素材（Wikimedia Commons・Openverse）か
      # AI 生成（Workers AI、1日40枚まで）の写真を付ける。画像は Workers KV に置き /img/ で配信する。失敗しても記事の公開は止めない
      # 速報レーンの回は公開を急ぐので、時間を短く区切って速いモデルだけ使う
      # 地震・津波の回は写真を付けない（災害の写真・イメージ画像は使わない。記事も noPhoto）
      - name: Article images
        if: ${{ !startsWith(inputs.fast_url || '', 'https://www.data.jma.go.jp/') }}
        continue-on-error: true
        timeout-minutes: 9
        env:
          LLM_WORKFLOW: images  # 無料枠の取り分を数えるジョブ名（scripts/llm.py）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          FAST_URL: ${{ inputs.fast_url }}
          # 写真も AI のイメージも無い記事の「図の表紙」（scripts/figure_cover.py・台帳 I9）。オーナーの見た目の確認後に変数で 1 にする
          IMAGE_FIGURE_COVER: ${{ vars.IMAGE_FIGURE_COVER || '0' }}
        # 1本の時間に上限（IMAGE_ARTICLE_SECONDS・既定150秒）があり、budget の後は新しい記事に手を付けない。
        # budget＋最後の1本（残り時間に収める）＋表紙・主役の位置の後始末が timeout 500 に収まるよう 380 にした（2026-11-10: 420 では2本目の途中で exit 124 に切られていた）
        run: |
          if [ -n "$FAST_URL" ]; then
            timeout 120 python scripts/images.py --changed --fast --max 3 --budget 50
          else
            timeout 500 python scripts/images.py --changed --recent 40 --max 15 --budget 380
          fi

      # Muse（Meta の AI アプリ）が描いた表紙の写真を付け、今日の写真の無い記事を優先の順に Muse に頼む（2026-11-08 オーナー承認・台帳 I8）。
      # 写真の順: 使える公式の写真 → Muse の写真（1日 MUSE_IMAGE_DAILY 枚・未設定なら20）→ Workers AI の表紙（無料の40枚の中）→ 文字だけ。
      # 写真は content/muse_images/（オーナーの Mac の scripts/muse_images_push.py が入れる）。状態は state/muse_images.json
      - name: Muse images
        if: ${{ (inputs.fast_url || '') == '' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          MUSE_IMAGE_DAILY: ${{ vars.MUSE_IMAGE_DAILY || '20' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
        run: timeout 240 python scripts/muse_images.py

      # 本文の図（public/fig/<slug>-fig1.png など）を記事の figures 欄に付ける（scripts/map_figures.py。図が無ければ何もしない）
      - name: Article figures
        continue-on-error: true
        run: python scripts/map_figures.py | tail -5

      # 記事ページの右の列の「よく読まれている記事」（自前の計測。scripts/popular_articles.py → content/popular.json）。
      # 記事が増えた回（どのみちデプロイする回）だけ書き直す（一覧のためだけにデプロイしない）
      - name: Popular articles
        if: ${{ (inputs.fast_url || '') == '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          AFF_STATS_TOKEN: ${{ secrets.AFF_STATS_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain content/articles)" ]; then
            python scripts/popular_articles.py | tail -3
          fi

      # 同じ発表の重複記事に印（duplicateOf）を付ける（scripts/story.py。サイトは noindex・canonical を代表へ・サイトマップから外す）。
      # 生成前にも同じ判定で外しているが、別の回・別のレーンで作られたものをここで拾う。直近7日に載せた記事だけ見直す（LLM なし）
      - name: Mark duplicate stories
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain content/articles)" ]; then
            python scripts/story.py mark --days 7 | tail -20
          fi

      # 新しい名前の「〜とは」の記事を名前ごとに1本にし、ほかの記事の本文の最初の1か所から結ぶ（scripts/canonical_names.py。台帳 A68。LLM なし）
      - name: Link names to their canonical explainer
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain content/articles)" ]; then
            python scripts/canonical_names.py link --days 7 | tail -10
          fi

      # Google Discover に向く記事に印（discoverCandidate）を付ける（1日5本まで・大きな画像・題名に数字・あおりなし。台帳 A57。LLM なし）
      - name: Discover candidates
        if: ${{ !startsWith(inputs.fast_url || '', 'https://www.data.jma.go.jp/') }}
        continue-on-error: true
        run: python scripts/discover_pick.py

      # 値上げ・障害・リコール・サービス終了の一覧（/roundups/<kind>。台帳 A52）。公開中の記事から規則で作り直す（LLM なし）。
      # 一覧が変わったときだけ content/topic_lists.json を書き直す（このあとのコミット・デプロイに入る）
      - name: Topic lists
        continue-on-error: true
        run: python scripts/topic_lists.py

      # 新しい質の良い記事が出たら古い記事を取り下げる一回きりの決まり（scripts/genre_focus.py の REPLACE_ON_FIRST。2026-11-04 オーナー承認）。
      # 投資・マネーの新しい記事が公開に回った回に、証券会社の動画の要約の記事を取り下げる（同じ回のコミット・デプロイに入る）。済んだら何もしない
      - name: Retire replaced genre articles
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain content/articles)" ]; then
            python scripts/genre_focus.py --retire-replaced
          fi

      # 記事は毎回コミットするが、Vercel へのデプロイは1時間に1回にまとめる。
      # デプロイのたびに全ファイルの保存（Deployment Storage）と ISR キャッシュの作り直し
      # （Fast Origin Transfer）が発生するため、20分ごとに出すと無駄が大きい。
      # デプロイするのは「前回から55分以上」「6時間ごとの回」「手動実行（full）」のとき。
      # それ以外は "[no-deploy]" を付けてコミットし、scripts/vercel_ignore.sh がビルドを飛ばす。
      # 次にデプロイするコミットは HEAD をビルドするので、溜まった記事もまとめて公開される。
      # 記事が増えない回でも、保留中の記事があって55分たっていれば "[deploy]" の空コミットで公開する。
      # 前回のデプロイ時刻は state/last_deploy、保留の有無は state/deploy_pending（state/ はビルド対象外）
      # 速報（主要企業の公式発表。記事 JSON の breaking: true）を作った回は、待たずにデプロイして
      # breaking_post.yml を呼ぶ（デプロイ完了を待って Threads・X・Facebook にすぐ出す）
      # 記事づくりの見張り: 候補があるのに0本の回が2回続いたら issue（ラベル pipeline-stalled）を立て、直ったら閉じる
      # 速報レーンの回も動かす（記事ができたら、止まっている issue をすぐ閉じる）
      - name: Pipeline health
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pipeline_health.py --alert

      # 止まりの見張り（2026-11-09 オーナー「作業止まるみたいなこと多いからなくして」）: stall_watch.yml の予約が遅れても、
      # 約20分ごとのこの回で、記事90分なし・公開／テスト／前の回の失敗・SNS の枠の取りこぼしを調べて issue（ラベル stall）を開く・閉じる。
      # テストはこの回の push の前（scripts/git_safe_push.py）で動くので、ここでは動かさない。state/stall.json は stall_watch.yml が書く
      - name: Stall watch
        if: ${{ (inputs.fast_url || '') == '' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/stall_watch.py --issue --skip-tests

      - name: Commit & push
        id: commit
        env:
          FORCE_DEPLOY: ${{ github.event.schedule == '7 */6 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode || 'full') == 'full') || (inputs.fast_url || '') != '' }}
        run: |
          echo "count=0" >> "$GITHUB_OUTPUT"
          echo "deploy=0" >> "$GITHUB_OUTPUT"
          echo "breaking=0" >> "$GITHUB_OUTPUT"
          mkdir -p state
          NOW=$(date -u +%s)
          LAST=$(cat state/last_deploy 2>/dev/null | tr -cd '0-9')
          LAST=${LAST:-0}
          PENDING=$(cat state/deploy_pending 2>/dev/null | tr -cd '0-9')
          PENDING=${PENDING:-0}
          DUE=0
          if [ "$FORCE_DEPLOY" = "true" ] || [ $((NOW - LAST)) -ge 3300 ]; then DUE=1; fi
          echo "前回のデプロイから $(( (NOW - LAST) / 60 )) 分 / 保留=${PENDING} / 強制=${FORCE_DEPLOY} / デプロイ対象=${DUE}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 速報レーンの処理結果（Worker がこれを見て再起動をやめる）
          ACK=0
          if [ -n "$(git status --porcelain state/fast_lane.json)" ]; then ACK=1; fi
          # 料金・プラン・リリースノートの見張りの基準（scripts/page_watch.py）。変わった回だけ残す（残さないと毎回「初回」になる）
          WATCH=0
          if [ -n "$(git status --porcelain state/page_watch.json)" ]; then WATCH=1; fi
          # Claude API の使用量（月の予算の管理。scripts/llm.py）。記事が増えなかった回も残す（残さないと使った分を数え漏らす）
          APIUSE=0
          if [ -n "$(git status --porcelain state/claude_api_usage.json state/pipeline_health.json state/muse_articles.json state/muse_images.json)" ]; then APIUSE=1; fi
          # いま検索で急上昇している話題（scripts/trends.py。台帳 A63）
          TRENDS=0
          if [ -n "$(git status --porcelain state/trend_signals.json state/trend_queue.json)" ]; then TRENDS=1; fi
          if [ -n "$(git status --porcelain content)" ]; then
            # 直近の記事の索引（見張り番のレーダーが「同じ話題の記事がもうあるか」を見る）。記事が変わった回だけ書き直す
            python scripts/radar.py coverage || echo "::warning::記事の索引（state/coverage.json）を更新できませんでした"
            if [ -f state/coverage.json ]; then git add state/coverage.json; fi
            git add content
            COUNT=$(git diff --cached --name-only --diff-filter=A -- 'content/articles/*.json' | wc -l | tr -d ' ')
            echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
            MSG="chore(content): 記事を自動生成・まとめを更新 (+${COUNT}本)"
            BREAKING=$(git diff --cached --name-only --diff-filter=A -- 'content/articles/*.json' \
              | xargs -r jq -r 'select(.breaking == true) | .slug' | tr '\n' ' ')
            # 地震・津波の続報で安全の通知（大津波警報・津波警報・震度6弱以上）になった記事も、すぐ通知に回す
            SAFETY=$(git diff --cached --name-only --diff-filter=M -- 'content/articles/quake-*.json' \
              | xargs -r jq -r 'select(.safetyAlert == true) | .slug' | tr '\n' ' ')
            BREAKING="${BREAKING}${SAFETY}"
            # いま検索で急上昇している言葉に当たった記事（searchTrend。台帳 A63）は待たずにデプロイして、
            # Google ニュースのサイトマップと IndexNow にすぐ載せる（SNS の速報投稿にはしない）
            TRENDING=$(git diff --cached --name-only --diff-filter=A -- 'content/articles/*.json' \
              | xargs -r jq -r 'select((.searchTrend // "") != "") | .slug' | tr '\n' ' ')
            if [ -n "$TRENDING" ]; then
              echo "検索で急上昇している話題の記事: ${TRENDING}→ すぐデプロイします"
              DUE=1
            fi
            if [ -n "$BREAKING" ]; then
              echo "速報の記事: ${BREAKING}→ すぐデプロイして即時投稿します"
              DUE=1
              echo "breaking=1" >> "$GITHUB_OUTPUT"
              MSG="${MSG} 速報"
            fi
            if [ "$DUE" = "1" ]; then
              echo "$NOW" > state/last_deploy
              echo 0 > state/deploy_pending
              echo "deploy=1" >> "$GITHUB_OUTPUT"
            else
              echo 1 > state/deploy_pending
              MSG="${MSG} [no-deploy]"
            fi
          elif [ "$PENDING" = "1" ] && [ "$DUE" = "1" ]; then
            # 記事は増えていないが、前の回で保留した記事を公開する
            echo "$NOW" > state/last_deploy
            echo 0 > state/deploy_pending
            echo "deploy=1" >> "$GITHUB_OUTPUT"
            MSG="chore(deploy): 保留中の記事を公開 [deploy]"
          elif [ "$ACK" = "1" ]; then
            MSG="chore(fast): 速報レーンの処理結果を記録"
          elif [ "$WATCH" = "1" ]; then
            MSG="chore(watch): 料金・リリースノートの見張りの記録を更新"
          elif [ "$APIUSE" = "1" ]; then
            MSG="chore(llm): Claude API の使用量・記事づくりの見張りを記録"
          elif [ "$TRENDS" = "1" ]; then
            MSG="chore(trends): 話題のキーワードを更新"
          else
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git add state/last_deploy state/deploy_pending
          if [ -f state/fast_lane.json ]; then git add state/fast_lane.json; fi
          if [ -f state/page_watch.json ]; then git add state/page_watch.json; fi
          if [ -f state/claude_api_usage.json ]; then git add state/claude_api_usage.json; fi
          if [ -f state/pipeline_health.json ]; then git add state/pipeline_health.json; fi
          if [ -f state/rivals_checked.json ]; then git add state/rivals_checked.json; fi
          if [ -f state/muse_articles.json ]; then git add state/muse_articles.json; fi
          if [ -f state/muse_images.json ]; then git add state/muse_images.json; fi
          if [ -f state/trend_signals.json ]; then git add state/trend_signals.json; fi
          if [ -f state/trend_queue.json ]; then git add state/trend_queue.json; fi
          git commit -m "$MSG"
          # 実行中に main が進んでいても、この回の記事を落とさずに載せ直して push する（scripts/git_safe_push.py）。
          # 別のジョブが同じ記事 JSON を直していたら項目ごとにマージする（この回が変えた項目だけこの回の値）。新しい記事は必ず残す
          if python3 scripts/git_safe_push.py --regen "python scripts/radar.py coverage"; then exit 0; fi
          echo "::error::push できませんでした"
          exit 1

      # Cloudflare へデプロイする（GITHUB_TOKEN の push では他のワークフローが起動しないため、明示的に呼ぶ）
      - name: Deploy to Cloudflare
        if: ${{ steps.commit.outputs.deploy == '1' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_cloudflare.yml --ref main

      # 速報の即時投稿（breaking_post.yml が、記事と図解カードが 200 になるのを待って出す）
      - name: Trigger breaking post
        if: ${{ steps.commit.outputs.breaking == '1' && steps.commit.outputs.deploy == '1' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run breaking_post.yml --ref main

      # 検索エンジンへの更新の通知（IndexNow）は deploy_cloudflare.yml が、ページが開けるようになってから送る（seo A2・LLMO-A3）。
      # ここ（デプロイの完了を待たない呼び出しの直後）で送ると、まだ公開されていない URL を知らせてしまうため

      # 新着記事を Threads に投稿する（公式APIは無料）。
      # 変数 THREADS_MODE が live 以外なら、下書きをサマリーに出すだけで何も公開しない。
      # 新着が無い回も走らせ、未投稿分の再挑戦とトークンの期限延長を行う。
      # state/ だけの変更は vercel.json の ignoreCommand により再ビルドされない。
      # Buffer API の上限（24時間の窓。2026-11-03 に当たって予約が止まった）を守るため、
      # threads_post.py は空き枠を手元の履歴（state/threads_posted.json）だけで先に決め、予約するものがある回だけ Buffer を呼ぶ。
      # チャンネルの ID は state/buffer_channels.json、呼び出し回数は state/buffer_calls/pipeline.json（scripts/buffer_budget.py）
      - name: Post to Threads
        # 予約は次の8時間の空き枠だけを埋める（同じ枠は二重に取らない。過ぎた枠は飛ばす）。GitHub の定期実行は混むと数時間遅れて
        # 朝の枠を取り逃すので、速報レーン以外の毎回で空き枠を確かめる（空き枠が無ければ Buffer は0回）
        if: ${{ (inputs.fast_url || '') == '' }}
        continue-on-error: true
        env:
          LLM_WORKFLOW: sns_helper  # 無料枠の取り分を数えるジョブ名（scripts/llm.py）
          THREADS_MODE: ${{ vars.THREADS_MODE }}
          THREADS_TOKEN_KEY: ${{ secrets.THREADS_TOKEN_KEY }}
          # Buffer 経由で投稿する場合の API キー（設定されていればこちらを優先）
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # Buffer の呼び出し回数の記録の名前（state/buffer_calls/pipeline.json。scripts/buffer_budget.py）
          BUFFER_LEDGER: pipeline
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
          # 学習の目当て（投稿ごとの訪問）を自前の計測から読む鍵（scripts/threads_learn.py。読むだけ）
          AFF_STATS_TOKEN: ${{ secrets.AFF_STATS_TOKEN }}
          # 通常枠の AI 以外の記事のテスト（12:15・21:00。11/4〜11/10）。off で止める
          SNS_NON_AI_SLOTS: ${{ vars.SNS_NON_AI_SLOTS }}
          BUFFER_DAILY_CAP: ${{ vars.BUFFER_DAILY_CAP }}
          BUFFER_MONITOR_CAP: ${{ vars.BUFFER_MONITOR_CAP }}
          # 1日の投稿本数（Threads・X・Facebook 共通）。凍結を避けて週に1〜2本ずつ増やす
          SNS_PER_DAY: ${{ steps.ramp.outputs.sns_per_day }}
          SNS_HOOK_FORMAT: ${{ vars.SNS_HOOK_FORMAT || '1' }}  # Muse の型の文面（2026-11-05 オーナー承認で既定 1。止めるなら変数を 0。台帳 S30）
          # 速報の即時投稿の1日の上限（別枠・最大5）。速報待ちの記事を通常の予約に回さない判定に使う
          BREAKING_PER_DAY: ${{ vars.BREAKING_PER_DAY }}
          # 朝のまとめ・問いかけ投稿（sns_extra.yml）の枠を空けるか。0 で止めて通常の投稿に戻す
          SNS_DIGEST: ${{ vars.SNS_DIGEST }}
          # 以前の形の記事に、問いかけの1文だけを軽いモデルで書かせる（失敗したら記事の主役から作る問い）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 問いかけの1文は Claude API の Haiku（補助の段・予算の範囲）。だめなら上の無料モデル
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_API_MONTHLY_BUDGET_USD }}
          LLM_DEFAULT_PURPOSE: helper
          GH_TOKEN: ${{ github.token }}  # 門番が止めた投稿の issue を立てる
        run: |
          # 投稿ごとの反応を取り込んで「勝ちパターン」を学び直してから、次の投稿を選ぶ
          # 反応の取得は1日1回（Buffer の数値も1日1回更新）。前回の取得から20時間たっていなければ Buffer を呼ばずにすぐ終わる
          python scripts/threads_learn.py || echo "::warning::Threads の学習に失敗しました（投稿は続けます）"
          python scripts/threads_post.py --max 2
          # X・Bluesky・Facebook も Threads と同じ読者向けの書き方（2026-11-08 夜 オーナー承認・sns_rules ルール23）。
          # 3つの SNS の投稿の処理は LLM を使わないので、これから出しそうな記事の文面をここで先に作る（state/threads_reader.json に下書き）
          python scripts/sns_reader.py --prepare --max 3 || echo "::warning::読者向けの文面を作れませんでした（X・Bluesky・Facebook は今までの書き方で出ます）"
          # SNS の予定に入った記事を Muse の受け渡し（state/muse_queue.json）に足す（2026-11-05 すべての投稿の動画を Muse で。台帳 S30）
          python scripts/muse_queue.py || echo "::warning::Muse の受け渡しを更新できませんでした（投稿は自動動画で続きます）"
          # SNS の予定と実績（今日の枠・記事と、実際に出た投稿）を state/sns_plan_actual.json に残す（夜の報告が読む。2026-11-08）
          python scripts/sns_plan_actual.py || echo "::warning::SNS の予定と実績を記録できませんでした"
          if [ -z "$(git status --porcelain state)" ]; then
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "chore(threads): 投稿履歴を更新"
          python3 scripts/git_safe_push.py && exit 0
          echo "::warning::Threads の投稿履歴を push できませんでした（次回、同じ記事を二重投稿する恐れがあります）"

      # 連携先の管理システムへ生成完了を通知する。
      # WEBHOOK_URL が未設定なら何もしない（設定した時点で有効になる）。
      - name: Notify integration webhook
        if: ${{ steps.commit.outputs.count != '0' }}
        env:
          WEBHOOK_URL: ${{ secrets.INTEGRATION_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.INTEGRATION_WEBHOOK_SECRET }}
          COUNT: ${{ steps.commit.outputs.count }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "INTEGRATION_WEBHOOK_URL 未設定のため通知をスキップします。"
            exit 0
          fi
          TOTAL=$(ls -1 content/articles/*.json 2>/dev/null | wc -l | tr -d ' ')
          BODY=$(jq -nc \
            --arg count "$COUNT" --arg total "$TOTAL" \
            --arg run "$GITHUB_RUN_ID" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event:"articles.generated", created:($count|tonumber), total:($total|tonumber), runId:$run, occurredAt:$at}')
          # 改ざん検知のため HMAC-SHA256 署名を付ける（受信側で同じ鍵で検証）
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r | cut -d' ' -f1)
          curl -sS --fail-with-body --retry 3 --retry-delay 5 -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Saisoku-Signature: sha256=$SIG" \
            -d "$BODY" && echo "通知しました (+${COUNT}本)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 自動生成パイプライン"
            echo ""
            echo "- 記事総数: $(ls -1 content/articles/*.json 2>/dev/null | wc -l | tr -d ' ')"
            echo "- 実行時刻: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            python scripts/latency.py report --days 7 --markdown || true
          } >> "$GITHUB_STEP_SUMMARY"
