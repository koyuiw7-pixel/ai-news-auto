name: Refresh product catalog

# 記事生成から独立。失敗はこのワークフローで見えるようにし、毎記事で再取得しない。
on:
  schedule:
    - cron: "43 22 * * *" # 07:43 JST（多少遅れても更新に支障なし）
  workflow_dispatch:
    inputs:
      force:
        description: "確認済みでも再取得する（通常はfalse）"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: product-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test parsing and preservation
        run: python -m unittest discover -s tests -p 'test_rakuten_books.py'
      - name: Refresh books and partner prices
        id: refresh
        env:
          FORCE: ${{ inputs.force }}
        run: |
          AGE=20
          if [ "$FORCE" = "true" ]; then AGE=0; fi
          python -u scripts/rakuten_books.py --if-older-than "$AGE" --report "$RUNNER_TEMP/product-refresh.json"
      - name: Save refresh evidence
        if: ${{ !cancelled() && steps.refresh.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: product-refresh-report
          path: ${{ runner.temp }}/product-refresh.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save a fully verified catalog
        id: commit
        if: ${{ !cancelled() && steps.refresh.outcome != 'skipped' }}
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git add content/products.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(products): 商品候補と確認済み価格を更新"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && {
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
            # 商品ファイル自体の競合を勝手に上書きしない。
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then exit 1; fi
            sleep 5
          done
          exit 1
      - name: Deploy validated catalog
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_cloudflare.yml --ref main
