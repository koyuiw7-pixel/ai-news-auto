name: Angle articles

# 大きなニュースを別の角度から記事にする（scripts/angle_articles.py）。Claude（オーナーの契約）で書く
on:
  workflow_dispatch:
    inputs:
      base:
        description: "元記事の slug"
        required: true
      sources:
        description: "一次情報のURL（スペース区切り）"
        required: true
      angles:
        description: "角度（方向|疑問|読者 を ;; で区切って複数）"
        required: true

permissions:
  contents: write

concurrency:
  group: auto-article-pipeline
  cancel-in-progress: false

jobs:
  angle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm i -g @anthropic-ai/claude-code
      - name: Generate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE: ${{ github.event.inputs.base }}
          SOURCES: ${{ github.event.inputs.sources }}
          ANGLES: ${{ github.event.inputs.angles }}
        run: |
          args=(--base "$BASE" --tier quality)
          for s in $SOURCES; do args+=(--source "$s"); done
          IFS=$'\n'; for a in $(printf '%s' "$ANGLES" | sed 's/;;/\n/g'); do args+=(--angle "$a"); done
          python scripts/angle_articles.py "${args[@]}"
      - name: Commit
        run: |
          if [ -z "$(git status --porcelain content)" ]; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "chore(content): 別の角度の記事を追加"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && exit 0; sleep 5; done
          exit 1
