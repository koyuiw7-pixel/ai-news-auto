name: Weekly AI Roundup

# 毎週月曜 07:00 JST（日曜 22:00 UTC）に、前の週の「今週のAIニュースまとめ」を作る（scripts/weekly.py）。
# content/weekly.json に足してコミットし、Cloudflare へデプロイする（/weekly/[yyyy-ww]・RSS・サイトマップに出る）。
on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      week:
        description: "作る週（yyyy-ww。空なら前の週）"
        required: false
        default: ""
      force:
        description: "作成済みでも作り直す"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-roundup
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 週1回なので質重視の枠（Claude Code）を使う。無ければ Gemini → 軽量モデルの順に自動で切り替わる
      - name: Install Claude Code CLI
        continue-on-error: true
        run: npm i -g @anthropic-ai/claude-code

      - name: Build weekly roundup
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_DAILY_MAX: ${{ vars.CLAUDE_DAILY_MAX || '40' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.week }}" ]; then ARGS="$ARGS --week ${{ github.event.inputs.week }}"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/weekly.py $ARGS

      - name: Commit & push
        id: commit
        run: |
          echo "changed=0" >> "$GITHUB_OUTPUT"
          # 使用回数の記録は auto_run と取り合いになるので、ここではコミットしない
          git checkout -- content/llm_usage.json 2>/dev/null || true
          if [ -z "$(git status --porcelain content/weekly.json)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/weekly.json
          git commit -m "chore(weekly): 今週のAIニュースまとめを追加"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "changed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push に失敗しました。リトライ $i/3"
            sleep 5
          done
          echo "::error::push に3回失敗しました"
          exit 1

      # GITHUB_TOKEN の push では他のワークフローが起動しないので、明示的にデプロイする
      - name: Deploy to Cloudflare
        if: ${{ steps.commit.outputs.changed == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_cloudflare.yml --ref main
