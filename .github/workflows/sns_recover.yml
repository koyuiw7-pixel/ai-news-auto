name: Recover normal SNS posts

# 通常SNS投稿だけを再実行する。記事生成やLLMを呼ばず、既存の枠・履歴・本数制限を使う。
# 定期実行は追加しない。通常運転はauto_run.ymlのまま。
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # SNS ルールの門番（scripts/sns_rules.py）が止めた投稿の issue（ラベル sns-rule-violation）

concurrency:
  group: auto-article-pipeline
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test publication check
        run: python3 -m unittest discover -s tests -p 'test_sns_publish_check.py' -v
      - name: Read existing limits
        id: ramp
        env:
          SNS_PER_DAY_OVERRIDE: ${{ vars.SNS_PER_DAY }}
        run: python3 scripts/ramp.py
      - name: Schedule normal posts
        env:
          THREADS_MODE: ${{ vars.THREADS_MODE }}
          THREADS_TOKEN_KEY: ${{ secrets.THREADS_TOKEN_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LEDGER: recover
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
          SNS_HOOK_FORMAT: ${{ vars.SNS_HOOK_FORMAT || '1' }}  # Muse の型の文面（2026-11-05 オーナー承認で既定 1。止めるなら変数を 0。台帳 S30）
          THREADS_LINK_AB: ${{ vars.THREADS_LINK_AB || '1' }}  # Threads のリンクの位置の比べ（2026-11-05 オーナー承認・11/5〜11/12。S31）
          SNS_PER_DAY: ${{ steps.ramp.outputs.sns_per_day }}
          BREAKING_PER_DAY: ${{ vars.BREAKING_PER_DAY }}
          SNS_DIGEST: ${{ vars.SNS_DIGEST }}
          GH_TOKEN: ${{ github.token }}  # 門番が止めた投稿の issue を立てる
        run: |
          cp state/threads_posted.json "$RUNNER_TEMP/sns-before.json"
          python3 scripts/threads_post.py --max 2
      - name: Save posting history without losing concurrent updates
        if: always()
        run: |
          if git diff --quiet -- state/threads_posted.json state/threads_token.enc && [ -z "$(git status --porcelain state/buffer_calls)" ]; then exit 0; fi
          cp state/threads_posted.json "$RUNNER_TEMP/sns-posted.json"
          cp state/buffer_calls/recover.json "$RUNNER_TEMP/buffer_ledger.json" 2>/dev/null || true  # Buffer の呼び出し回数（30日の合計に要る。2026-11-05）

          TOKEN_CHANGED=0
          if ! git diff --quiet -- state/threads_token.enc; then
            TOKEN_CHANGED=1
            cp state/threads_token.enc "$RUNNER_TEMP/sns-token.enc"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          before = json.loads((temp / "sns-before.json").read_text())
          mine = json.loads((temp / "sns-posted.json").read_text())
          path = Path("state/threads_posted.json")
          latest = json.loads(path.read_text())
          for slug, entry in mine["posted"].items():
              if slug not in before["posted"]:
                  if slug in latest["posted"] and latest["posted"][slug].get("id") != entry.get("id"):
                      raise RuntimeError(f"投稿履歴の競合: {slug}。Bufferを確認してから再実行してください。")
                  latest["posted"].setdefault(slug, entry)
          path.write_text(json.dumps(latest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            git add state/threads_posted.json
            if [ -f "$RUNNER_TEMP/buffer_ledger.json" ]; then mkdir -p state/buffer_calls; cp "$RUNNER_TEMP/buffer_ledger.json" state/buffer_calls/recover.json; git add state/buffer_calls/recover.json; fi
            if [ "$TOKEN_CHANGED" = "1" ]; then
              cp "$RUNNER_TEMP/sns-token.enc" state/threads_token.enc
              git add state/threads_token.enc
            fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(sns): 通常投稿の復旧履歴を記録 [no-deploy]"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::投稿履歴を保存できませんでした。再実行前にBufferの受付と履歴を照合してください。"
          exit 1
