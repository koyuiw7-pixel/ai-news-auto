name: Daily Newsletter

# 毎朝 07:00 JST（22:00 UTC）に、前日の主要記事5本をメールで配信する（scripts/newsletter.py）。
# LINE公式アカウントへのダイジェストも同じ時刻に（scripts/line_digest.py。既定は月曜だけ）。
# どちらも鍵が未設定なら何もせず成功で終わる。
#
# メール（どちらか一方）:
#   CF_EMAIL_TOKEN   … Cloudflare API トークン（Email Sending: Edit）。CLOUDFLARE_ACCOUNT_ID も使う
#   RESEND_API_KEY   … Resend の API キー
#   購読者の読み出しは CF_DEPLOY_TOKEN（Workers KV Storage: Edit を含む）を流用
# LINE:
#   LINE_CHANNEL_ACCESS_TOKEN … Messaging API のチャネルアクセストークン（長期）
#   変数 LINE_DIGEST_DAYS     … 配信する曜日（既定 mon。daily で毎日）
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "今日配信済みでも送る（メール）／曜日を無視する（LINE）"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Email digest
        env:
          CF_EMAIL_TOKEN: ${{ secrets.CF_EMAIL_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_DEPLOY_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          NEWSLETTER_KV_TOKEN: ${{ secrets.NEWSLETTER_KV_TOKEN }}
        run: python scripts/newsletter.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: LINE digest
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_DIGEST_DAYS: ${{ vars.LINE_DIGEST_DAYS }}
        run: python scripts/line_digest.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
