name: SNS extra posts

# 朝のまとめ「今朝のAIニュース3本」（毎朝 7:15 JST。2026-11-05〜 1日6枠の1本目・台帳 S27）。週2回の問いかけ投稿（火・金）は 2026-11-03 に停止（記事のない定型の投稿。SNS ルール1・3）。
# 少し早めに起動し、Buffer で枠の時刻に予約する。別系統のCloudflare見張り番も未完了分を回収する。
# 同じconcurrencyで直列化し、最新mainとBufferの既存投稿を照合してから不足媒体だけを送る。
# 朝の回は、自分の投稿に付いたコメントの一覧（scripts/threads_inbox.py → state/threads_inbox.json）も更新する。自動返信はしない。
# 手動実行で test=true にすると、Buffer に下書きを作って消すだけ（何も公開しない）。
on:
  schedule:
    - cron: "40 21 * * *"     # 毎日 6:40 JST → 7:15 に予約（定期実行の遅れを見込んで早めに）
    # 問いかけ投稿（火・金 11:45）は 2026-11-03 にオーナー判断で停止（AIらしさが強く狙いが不明）
  workflow_dispatch:
    inputs:
      kind:
        description: "digest / inbox（poll は停止中）"
        required: false
        default: "inbox"
      test:
        description: "true=下書きを作って消すだけ（トピック・本文の確認。公開しない）"
        required: false
        default: "false"
      date:
        description: "対象の日本日付 YYYY-MM-DD（見張り番は必ず指定。翌日への遅延誤送信を防ぐ）"
        required: false
        default: ""
      verify:
        description: "true=投稿先の状態照合のみ。投稿しない"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write  # SNS ルールの門番（scripts/sns_rules.py）が止めた投稿の issue（ラベル sns-rule-violation）

concurrency:
  group: sns-extra
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test delay and duplicate protection
        run: python -m unittest discover -s tests -p 'test_morning_digest.py'
      # 号の背景（案C）を作るときに画像を扱う
      - run: pip install -q pillow
      - name: Test drafts (nothing is published)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test == 'true' && inputs.verify != true }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LEDGER: extra
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
          KIND: ${{ inputs.kind }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
        run: |
          # 日次企画の修正検証では対象企画だけを確認し、不要なAPI消費を避ける。
          if [ "$KIND" = "digest" ]; then
            python scripts/morning_digest.py --kind "$KIND" --test-draft --force
            exit 0
          fi
          # hook_thread と問いかけ投稿（poll）は 2026-11-03 に停止（SNS ルール1〜3）。確かめるのは今の形だけ
          python scripts/threads_post.py --test-draft
          python scripts/morning_digest.py --test-draft --force
          python scripts/threads_inbox.py --no-save > "$RUNNER_TEMP/inbox.txt"
          grep -c '"url"' "$RUNNER_TEMP/inbox.txt" || true
          cat "$RUNNER_TEMP/inbox.txt"
      - name: Post
        if: ${{ inputs.verify != true && (github.event_name == 'schedule' || (inputs.test != 'true' && inputs.kind != 'inbox')) }}
        env:
          THREADS_MODE: ${{ vars.THREADS_MODE }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LEDGER: extra
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
          SNS_DIGEST: ${{ vars.SNS_DIGEST }}
          # 朝のまとめの号ページ（/digest/<日付>）のデータを KV に置く・案Cの背景を Workers AI で作る（scripts/digest_page.py）
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          GH_TOKEN: ${{ github.token }}  # 門番が止めた投稿の issue を立てる
          KIND: ${{ inputs.kind || 'digest' }}
          TARGET_DATE: ${{ inputs.date }}
        run: |
          ARGS=(--kind "$KIND")
          if [ -n "$TARGET_DATE" ]; then ARGS+=(--date "$TARGET_DATE"); fi
          python scripts/morning_digest.py "${ARGS[@]}"
      - name: Verify Buffer state (read only)
        if: ${{ inputs.verify == true }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LEDGER: extra
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
          KIND: ${{ inputs.kind }}
          TARGET_DATE: ${{ inputs.date }}
        run: |
          ARGS=(--kind "$KIND" --verify)
          if [ -n "$TARGET_DATE" ]; then ARGS+=(--date "$TARGET_DATE"); fi
          python scripts/morning_digest.py "${ARGS[@]}"
      - name: Comment inbox (read only)
        if: ${{ inputs.verify != true && (github.event.schedule == '5 22 * * *' || (inputs.test != 'true' && inputs.kind == 'inbox')) }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LEDGER: extra
          BUFFER_30D_CAP: ${{ vars.BUFFER_30D_CAP }}  # 30日のソフトの上限（空なら Essentials の 7,000。scripts/buffer_budget.py）
        run: python scripts/threads_inbox.py | tail -40
      # main が進んでいても衝突しないよう、最新の state に記録だけを足して push する
      - name: Commit history
        if: ${{ !cancelled() && inputs.test != 'true' && inputs.verify != true }}
        run: |
          if [ -z "$(git status --porcelain state content/digests)" ]; then exit 0; fi
          cp state/threads_posted.json "$RUNNER_TEMP/mine.json"
          cp state/buffer_calls/extra.json "$RUNNER_TEMP/buffer_ledger.json" 2>/dev/null || true  # Buffer の呼び出し回数（30日の合計に要る。2026-11-05）
          if [ -f state/threads_inbox.json ]; then cp state/threads_inbox.json "$RUNNER_TEMP/inbox.json"; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python scripts/morning_digest.py --merge "$RUNNER_TEMP/mine.json"
            if [ -f "$RUNNER_TEMP/inbox.json" ]; then cp "$RUNNER_TEMP/inbox.json" state/threads_inbox.json; git add state/threads_inbox.json; fi
            git add state/threads_posted.json
            if [ -f "$RUNNER_TEMP/buffer_ledger.json" ]; then mkdir -p state/buffer_calls; cp "$RUNNER_TEMP/buffer_ledger.json" state/buffer_calls/extra.json; git add state/buffer_calls/extra.json; fi
            # 号のデータ（--merge が投稿記録から書き戻す）。次のデプロイからサイトに同梱される
            git add content/digests 2>/dev/null || true
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(threads): 朝のまとめ・問いかけ投稿・コメント一覧を記録 [no-deploy]"
            git push origin HEAD:main && exit 0
            echo "push に失敗しました。リトライ $i/5"
            sleep 5
          done
          exit 1
